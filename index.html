  <!-- Gaya khusus untuk 3D Flashcard Flip, Animasi Mikro, dan Scrollbar Mobile -->
  <style>
    /* Efek perspektif 3D untuk membalik kartu flashcard */
    .perspective-1000 {
      perspective: 1200px;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }

    /* Sembunyikan scrollbar horizontal pada chip filter agar bersih seperti aplikasi mobile native */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animasi lembut saat masuk halaman / sheet */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-up {
      animation: fadeSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes sheetUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }
    .animate-sheet-up {
      animation: sheetUp 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Pastikan perilaku sentuhan mobile terasa responsif tanpa highlight biru default */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>

  <!-- =====================================================================
       LOGIKA UTAMA APLIKASI JPEZ (VANILLA JAVASCRIPT + PARSER TXT)
       ===================================================================== -->
  <script>
    /**
     * JPEZ Core Engine
     * - Mengurai file .txt format Anki (#separator, #columns, #tags column) secara utuh.
     * - Menyediakan antarmuka Flashcard 3D, Detail Item, Pencarian & Filter, serta Mode Latihan Interaktif.
     * - Menggunakan struktur state JSON internal dan sinkronisasi penyimpanan cloud otomatis (tanpa localStorage).
     */

    // =========================================================================
    // 1. PARSER FILE TXT AKURAT (SESUAI STRUKTUR KANJI.TXT & KOTOBA.TXT)
    // =========================================================================

    /**
     * Menghasilkan hash string deterministik agar ID item tetap stabil meski data dimuat ulang.
     */
    function stableHash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(36);
    }

    /**
     * Membersihkan tanda kutip ganda Anki TSV (contoh: "Saya mengatakan ""terima kasih""." -> Saya mengatakan "terima kasih".).
     */
    function unquoteField(value) {
      if (value === undefined || value === null) return '';
      let s = String(value).trim();
      if (s.length >= 2 && s.startsWith('"') && s.endsWith('"')) {
        s = s.slice(1, -1).replace(/""/g, '"');
      }
      return s;
    }

    /**
     * Memecah baris TSV/CSV sambil menghormati field ber-tanda kutip jika menggunakan koma/tab.
     */
    function splitDelimitedLine(line, separator) {
      if (separator === '\t') {
        return line.split('\t').map(unquoteField);
      }
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === separator && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    /**
     * Mengekstrak level JLPT dari kolom Tags (misal: "N5::Kanji::Bab01_Angka" -> "N5").
     */
    function extractJlptLevel(tags) {
      if (!tags) return 'Umum';
      const firstPart = tags.split('::')[0].trim().toUpperCase();
      if (/^N[1-5]$/.test(firstPart)) return firstPart;
      const match = tags.match(/\b(N[1-5])\b/i);
      return match ? match[1].toUpperCase() : 'Umum';
    }

    /**
     * Mengurai format contoh Kanji: "一つ【ひとつ】satu (benda)" menjadi objek terstruktur.
     */
    function parseKanjiExample(rawExample) {
      if (!rawExample || !rawExample.trim()) return null;
      const m = rawExample.trim().match(/^(.+?)【(.+?)】\s*(.*)$/);
      if (m) {
        return { raw: rawExample.trim(), word: m[1], reading: m[2], meaning: m[3] };
      }
      return { raw: rawExample.trim(), word: rawExample.trim(), reading: '', meaning: '' };
    }

    /**
     * Parser utama untuk Kanji.txt dan Kotoba.txt.
     * Membaca direktif #separator dan #columns serta mempertahankan seluruh baris asli.
     */
    function parseJpezTxt(rawText, expectedType) {
      const lines = rawText.split(/\r?\n/);
      let separator = '\t';
      let columns = null;
      const items = [];
      const seenIds = new Set();

      for (let i = 0; i < lines.length; i++) {
        const rawLine = lines[i];
        if (!rawLine || !rawLine.trim()) continue;

        // Baca metadata header Anki
        if (rawLine.startsWith('#')) {
          const lower = rawLine.toLowerCase();
          if (lower.startsWith('#separator:')) {
            const sepVal = rawLine.slice('#separator:'.length).trim().toLowerCase();
            if (sepVal === 'tab') separator = '\t';
            else if (sepVal === 'comma') separator = ',';
            else if (sepVal === 'semicolon') separator = ';';
            else if (sepVal === 'space') separator = ' ';
          } else if (lower.startsWith('#columns:')) {
            const colsRaw = rawLine.slice('#columns:'.length);
            columns = colsRaw.split(separator).map(c => c.trim());
          }
          continue;
        }

        const fields = splitDelimitedLine(rawLine, separator);
        if (fields.length < 2) continue;

        const getCol = (names, fallbackIdx) => {
          if (columns) {
            for (const n of names) {
              const idx = columns.findIndex(c => c.toLowerCase() === n.toLowerCase());
              if (idx !== -1 && fields[idx] !== undefined) return fields[idx];
            }
          }
          return fields[fallbackIdx] !== undefined ? fields[fallbackIdx] : '';
        };

        if (expectedType === 'kanji') {
          const kanji = getCol(['Kanji'], 0);
          const arti = getCol(['Arti'], 1);
          const onyomi = getCol(['Onyomi'], 2);
          const kunyomi = getCol(['Kunyomi'], 3);
          const contoh1 = getCol(['Contoh 1'], 4);
          const contoh2 = getCol(['Contoh 2'], 5);
          const contoh3 = getCol(['Contoh 3'], 6);
          const bab = getCol(['Bab'], 7) || 'Umum';
          const tags = getCol(['Tags'], 8) || '';

          if (!kanji) continue;

          let id = 'kanji_' + stableHash(`${kanji}|${bab}`);
          if (seenIds.has(id)) {
            let n = 2;
            while (seenIds.has(`${id}_${n}`)) n++;
            id = `${id}_${n}`;
          }
          seenIds.add(id);

          const examples = [contoh1, contoh2, contoh3]
            .map(parseKanjiExample)
            .filter(Boolean);

          items.push({
            id,
            type: 'kanji',
            kanji,
            arti,
            onyomi: onyomi || '-',
            kunyomi: kunyomi || '-',
            contoh1,
            contoh2,
            contoh3,
            examples,
            bab,
            tags,
            jlpt: extractJlptLevel(tags),
          });
        } else {
          const kata = getCol(['Kata'], 0);
          const bacaan = getCol(['Bacaan'], 1);
          const romaji = getCol(['Romaji'], 2);
          const arti = getCol(['Arti'], 3);
          const catatan = getCol(['Catatan'], 4);
          const contoh = getCol(['Contoh'], 5);
          const artiContoh = getCol(['Arti Contoh'], 6);
          const bab = getCol(['Bab'], 7) || 'Umum';
          const tags = getCol(['Tags'], 8) || '';

          if (!kata) continue;

          let id = 'kotoba_' + stableHash(`${kata}|${bacaan}|${arti}|${bab}`);
          if (seenIds.has(id)) {
            let n = 2;
            while (seenIds.has(`${id}_${n}`)) n++;
            id = `${id}_${n}`;
          }
          seenIds.add(id);

          items.push({
            id,
            type: 'kotoba',
            kata,
            bacaan,
            romaji,
            arti,
            catatan,
            contoh,
            artiContoh,
            bab,
            tags,
            jlpt: extractJlptLevel(tags),
          });
        }
      }

      return items;

    // =========================================================================
    // 2. STATE APLIKASI & UTILITAS TANGGAL
    // =========================================================================

    function getLocalDateKey(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatShortTime(ts) {
      try {
        const d = new Date(ts);
        return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      } catch {
        return '';
      }
    }

    function formatRelativeDay(ts) {
      const dateKey = getLocalDateKey(new Date(ts));
      const todayKey = getLocalDateKey(new Date());
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yestKey = getLocalDateKey(yesterday);
      if (dateKey === todayKey) return 'Hari ini';
      if (dateKey === yestKey) return 'Kemarin';
      return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    }

    function getItemProgress(id) {
      return appState.userData.progress[id] || { status: 'new', correct: 0, wrong: 0, lastAt: 0 };
    }

    function setItemStatus(id, newStatus, itemObj = null) {
      const prev = getItemProgress(id);
      appState.userData.progress[id] = {
        ...prev,
        status: newStatus,
        lastAt: Date.now(),
      };
      if (itemObj) {

        };
      }
      // Catat interaksi status ke progres harian bila berubah ke learning/mastered
      if (prev.status !== newStatus && (newStatus === 'learning' || newStatus === 'mastered')) {
        recordDailyReview(true, false);
      }
      saveUserData();
    }

    function recordDailyReview(isCorrect, countAccuracy = true) {
      const key = getLocalDateKey();
      if (!appState.userData.daily[key]) {
        appState.userData.daily[key] = { reviewed: 0, correct: 0, wrong: 0 };
      }
      appState.userData.daily[key].reviewed += 1;
      if (countAccuracy) {
        if (isCorrect) appState.userData.daily[key].correct += 1;
        else appState.userData.daily[key].wrong += 1;
      }
    }

    function pushActivityLog(modeLabel, detail, correct, total) {
      appState.userData.activity.unshift({
        id: 'act_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        modeLabel,
        detail,
        correct,
        total,
        timestamp: Date.now(),
      });
      // Batasi 40 riwayat terbaru agar ukuran data tetap ringan dan cepat
      if (appState.userData.activity.length > 40) {
        appState.userData.activity = appState.userData.activity.slice(0, 40);
      }
      saveUserData();
    }

    function calculateStreak() {
      const daily = appState.userData.daily || {};
      const today = new Date();
      let currentStreak = 0;

      // Cek mulai dari hari ini atau kemarin jika hari ini belum belajar
      const todayKey = getLocalDateKey(today);
      const hasToday = (daily[todayKey]?.reviewed || 0) > 0;
      const cursor = new Date(today);
      if (!hasToday) {
        cursor.setDate(cursor.getDate() - 1);
      }

      while (true) {
        const k = getLocalDateKey(cursor);
        if ((daily[k]?.reviewed || 0) > 0) {
          currentStreak++;
          cursor.setDate(cursor.getDate() - 1);
        } else {
          break;
        }
      }

      // Hitung best streak dari seluruh tanggal tercatat
      const activeKeys = Object.keys(daily)
        .filter(k => (daily[k]?.reviewed || 0) > 0)
        .sort();
      let bestStreak = currentStreak;
      let run = 0;
      let prevDate = null;
      for (const k of activeKeys) {
        const curDate = new Date(k + 'T00:00:00');
        if (prevDate) {
          const diffDays = Math.round((curDate - prevDate) / 86400000);
          run = diffDays === 1 ? run + 1 : 1;
        } else {
          run = 1;
        }
        if (run > bestStreak) bestStreak = run;
        prevDate = curDate;
      }

      return { currentStreak, bestStreak, hasToday };
    }

    function getCountsForList(list) {
      let mastered = 0;
      let learning = 0;
      let belum = 0;
      for (const item of list) {
        const st = getItemProgress(item.id).status;
        if (st === 'mastered') mastered++;
        else if (st === 'learning') learning++;
        else belum++;
      }
      return { total: list.length, mastered, learning, belum };
    }

        .replace(/"/g, '&quot;')

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const close = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = close;
      okBtn.onclick = () => {
        const keepOpen = onConfirm && onConfirm() === false;
        if (!keepOpen) close();
      };

            ${recommended.length === 0 ? `
              <div class="rounded-2xl bg-matcha-mintSoft p-4 text-center text-xs font-semibold text-matcha-dark">

              </div>
            ` : `
              <div class="space-y-2">
                ${recommended.map(({ item, prog }) => `
                  <button onclick="openItemDetail('${item.id}')" class="flex w-full items-center justify-between gap-3 rounded-2xl border border-white/80 bg-white/70 px-3 py-2.5 text-left active:scale-[0.98] transition">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="flex h-10 min-w-[44px] px-1.5 shrink-0 items-center justify-center rounded-xl bg-matcha-mintSoft font-jp text-base font-bold text-matcha-dark">

                      </div>
                      <div class="min-w-0">
                        <p class="truncate text-xs font-bold text-matcha-dark">${escapeHtml(item.arti)}</p>
                        <p class="truncate text-[11px] text-matcha-muted">
                          ${item.type === 'kanji' ? escapeHtml(item.onyomi + ' / ' + item.kunyomi) : escapeHtml(item.bacaan)}

    function startQuickKanjiFlashcard() {
      appState.kanjiUI.mode = 'flashcard';
      appState.kanjiUI.bab = 'Bab 1 - Angka';
      appState.kanjiUI.deckIndex = 0;
      appState.kanjiUI.flipped = false;
      switchTab('kanji');
    }

    // =========================================================================
    // 7. TAB 2: KANJI LEARNING (DAFTAR, FILTER, DETAIL, & FLASHCARD 3D)
    // =========================================================================

    function getFilteredKanji() {
      const ui = appState.kanjiUI;
      const q = ui.search.trim().toLowerCase();
      return appState.kanjiList.filter(item => {
        const prog = getItemProgress(item.id);
        if (ui.status !== 'all' && prog.status !== ui.status) return false;
        if (ui.bab !== 'all' && item.bab !== ui.bab) return false;
        if (ui.jlpt !== 'all' && item.jlpt !== ui.jlpt) return false;
        if (q) {
          const hay = [item.kanji, item.arti, item.onyomi, item.kunyomi, item.contoh1, item.contoh2, item.contoh3, item.bab].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

      const ui = appState.kanjiUI;
      const babs = [...new Set(appState.kanjiList.map(k => k.bab))];
      const jlpts = [...new Set(appState.kanjiList.map(k => k.jlpt))];
      const filtered = getFilteredKanji();

      container.innerHTML = `
        <div class="space-y-3.5 animate-fade-up">

            <div>
              <h1 class="text-xl font-extrabold text-matcha-dark">Koleksi Kanji</h1>
              <p class="text-xs text-matcha-muted">${filtered.length} dari ${appState.kanjiList.length} Kanji ditampilkan</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="startMemorizeSession({ mode: 'kanji_meaning', scope: 'kanji', bab: appState.kanjiUI.bab, count: 10 })" class="rounded-2xl border border-white/90 bg-white/75 px-3 py-2 text-xs font-bold text-matcha-primary shadow-sm active:scale-95 transition">
                Latihan
              </button>
              <button onclick="toggleKanjiMode()" class="rounded-2xl bg-matcha-primary px-3.5 py-2 text-xs font-bold text-white shadow-md active:scale-95 transition">
                ${ui.mode === 'list' ? 'Flashcard' : 'Daftar'}
              </button>
            </div>
          </header>

          <!-- Search Bar -->
          <div class="relative">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-matcha-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
            <input id="kanji-search-input" type="text" value="${escapeHtml(ui.search)}" placeholder="Cari Kanji, arti, onyomi, kunyomi, contoh..."
              class="w-full rounded-2xl border border-white/90 bg-white/75 py-2.5 pl-10 pr-9 text-xs font-medium text-matcha-dark placeholder-matcha-muted/70 shadow-glass backdrop-blur-xl focus:border-matcha-primary focus:outline-none">
            ${ui.search ? `<button onclick="clearKanjiSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-matcha-muted px-1">✕</button>` : ''}
          </div>

          <!-- Filter Status -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${[
              { id: 'all', label: 'Semua' },
              { id: 'new', label: 'Belum Hafal' },
              { id: 'learning', label: 'Sedang Dipelajari' },
              { id: 'mastered', label: 'Sudah Hafal' }
            ].map(st => `
              <button onclick="setKanjiFilter('status', '${st.id}')" class="shrink-0 rounded-full px-3.5 py-1.5 text-[11px] font-bold transition ${ui.status === st.id ? 'bg-matcha-primary text-white shadow-sm' : 'border border-white/80 bg-white/65 text-matcha-muted'}">
                ${st.label}
              </button>
            `).join('')}
          </div>

          <!-- Filter Level JLPT & Bab -->
          <div class="grid grid-cols-3 gap-2">
            <select onchange="setKanjiFilter('jlpt', this.value)" class="rounded-2xl border border-white/85 bg-white/70 px-3 py-2 text-xs font-semibold text-matcha-dark shadow-sm backdrop-blur-xl focus:outline-none">
              <option value="all" ${ui.jlpt === 'all' ? 'selected' : ''}>Level: Semua</option>
              ${jlpts.map(j => `<option value="${escapeHtml(j)}" ${ui.jlpt === j ? 'selected' : ''}>JLPT ${escapeHtml(j)}</option>`).join('')}
            </select>
            <select onchange="setKanjiFilter('bab', this.value)" class="col-span-2 rounded-2xl border border-white/85 bg-white/70 px-3 py-2 text-xs font-semibold text-matcha-dark shadow-sm backdrop-blur-xl focus:outline-none">
              <option value="all" ${ui.bab === 'all' ? 'selected' : ''}>Semua Bab (${babs.length})</option>
              ${babs.map(b => `<option value="${escapeHtml(b)}" ${ui.bab === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('')}
            </select>
          </div>

          <!-- Konten Utama: Daftar Kanji atau Mode Flashcard -->
          <div id="kanji-view-area">
            ${ui.mode === 'flashcard' ? renderKanjiFlashcardHtml(filtered) : renderKanjiListHtml(filtered)}
          </div>
        </div>
      `;

      // Pasang listener input pencarian tanpa menghilangkan fokus saat mengetik
      const input = document.getElementById('kanji-search-input');
      if (input) {
        input.addEventListener('input', (e) => {
          appState.kanjiUI.search = e.target.value;
          appState.kanjiUI.deckIndex = 0;
          appState.kanjiUI.flipped = false;
          const area = document.getElementById('kanji-view-area');
          if (area) {
            const nextFiltered = getFilteredKanji();
            area.innerHTML = appState.kanjiUI.mode === 'flashcard'

        });
      }

      if (ui.mode === 'flashcard') {
        attachSwipeHandlers('kanji-flashcard-stage', () => stepKanjiDeck(1), () => stepKanjiDeck(-1));
      }
    }

    function clearKanjiSearch() {
      appState.kanjiUI.search = '';
      renderKanjiTab(document.getElementById('main-content'));
    }

    function setKanjiFilter(key, val) {
      appState.kanjiUI[key] = val;
      appState.kanjiUI.deckIndex = 0;
      appState.kanjiUI.flipped = false;
      appState.kanjiUI.deckOrderIds = [];
      renderKanjiTab(document.getElementById('main-content'));
    }

    function toggleKanjiMode() {
      appState.kanjiUI.mode = appState.kanjiUI.mode === 'list' ? 'flashcard' : 'list';
      appState.kanjiUI.deckIndex = 0;
      appState.kanjiUI.flipped = false;
      appState.kanjiUI.deckOrderIds = [];
      renderKanjiTab(document.getElementById('main-content'));
    }

    function renderKanjiListHtml(filtered) {
      if (filtered.length === 0) {
        return `
          <div class="rounded-[24px] border border-white/80 bg-white/60 p-8 text-center shadow-glass backdrop-blur-xl">
            <p class="text-sm font-bold text-matcha-dark">Tidak ada Kanji yang cocok</p>

          </div>

      }

      for (const [babName, items] of groups.entries()) {

          <div class="space-y-2">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-extrabold uppercase tracking-wide text-matcha-dark">${escapeHtml(babName)}</h2>
              <span class="rounded-full bg-white/75 px-2.5 py-0.5 text-[10px] font-bold text-matcha-primary border border-white">${masteredCount}/${items.length} Hafal</span>
            </div>
            <div class="space-y-2">
              ${items.map(item => {
                const prog = getItemProgress(item.id);
                return `
                  <button onclick="openItemDetail('${item.id}')" class="flex w-full items-center justify-between gap-3 rounded-[22px] border border-white/85 bg-white/65 p-3 text-left shadow-glass backdrop-blur-xl active:scale-[0.98] transition">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-matcha-mintSoft border border-white font-jp text-2xl font-bold text-matcha-dark">
                        ${escapeHtml(item.kanji)}
                      </div>
                      <div class="min-w-0">

                          <span class="rounded-md bg-[#E8F1E3] px-1.5 py-0.5 text-[9px] font-bold text-matcha-primary">${escapeHtml(item.jlpt)}</span>
                        </div>
                        <p class="mt-0.5 truncate text-[11px] font-medium text-matcha-muted">
                          <span class="font-semibold text-matcha-primary">On:</span> ${escapeHtml(item.onyomi)} &nbsp;•&nbsp;
                          <span class="font-semibold text-matcha-primary">Kun:</span> ${escapeHtml(item.kunyomi)}
                        </p>
                      </div>
                    </div>
                    <div class="shrink-0">${getStatusBadge(prog.status)}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }
      html += '</div>';
      return html;
    }

    function getOrderedKanjiDeck(filtered) {
      const ui = appState.kanjiUI;
      if (appState.userData.settings.shuffleFlashcards && ui.deckOrderIds.length !== filtered.length) {
        const ids = filtered.map(x => x.id);
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        ui.deckOrderIds = ids;
      }
      if (ui.deckOrderIds.length === filtered.length) {
        const map = new Map(filtered.map(x => [x.id, x]));
        const ordered = ui.deckOrderIds.map(id => map.get(id)).filter(Boolean);
        if (ordered.length === filtered.length) return ordered;
      }
      return filtered;
    }

    function shuffleKanjiDeckNow() {
      const filtered = getFilteredKanji();
      const ids = filtered.map(x => x.id);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      appState.kanjiUI.deckOrderIds = ids;
      appState.kanjiUI.deckIndex = 0;
      appState.kanjiUI.flipped = false;
      renderKanjiTab(document.getElementById('main-content'));
      showToast('Urutan kartu Kanji diacak');
    }

    function renderKanjiFlashcardHtml(filtered) {
      if (filtered.length === 0) {
        return `
          <div class="rounded-[24px] border border-white/80 bg-white/60 p-8 text-center shadow-glass backdrop-blur-xl">
            <p class="text-sm font-bold text-matcha-dark">Deck Flashcard Kosong</p>
            <p class="mt-1 text-xs text-matcha-muted">Ubah filter untuk menampilkan kartu Kanji.</p>
          </div>
        `;
      }

      const deck = getOrderedKanjiDeck(filtered);
      if (appState.kanjiUI.deckIndex >= deck.length) appState.kanjiUI.deckIndex = 0;
      const item = deck[appState.kanjiUI.deckIndex];
      const prog = getItemProgress(item.id);
      const settings = appState.userData.settings;
      const isFlipped = appState.kanjiUI.flipped;

      return `
        <div class="space-y-3">
          <!-- Bar Info Dek -->
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-bold text-matcha-muted">Kartu ${appState.kanjiUI.deckIndex + 1} / ${deck.length}</span>
            <button onclick="shuffleKanjiDeckNow()" class="inline-flex items-center gap-1 rounded-full border border-white bg-white/75 px-3 py-1 text-[11px] font-bold text-matcha-primary shadow-sm active:scale-95 transition">
              🔀 Acak Dek
            </button>
          </div>

          <!-- Kartu Flashcard 3D -->
          <div id="kanji-flashcard-stage" onclick="flipKanjiCard()" class="perspective-1000 h-[350px] w-full cursor-pointer select-none">
            <div class="flashcard-inner ${isFlipped ? 'is-flipped' : ''}">
              <!-- Sisi Depan -->
              <div class="flashcard-face flex flex-col justify-between rounded-[30px] border border-white/90 bg-white/75 p-5 shadow-glassStrong backdrop-blur-2xl">
                <div class="flex items-center justify-between">
                  <span class="rounded-full bg-matcha-mintSoft px-2.5 py-1 text-[10px] font-bold text-matcha-primary">${escapeHtml(item.jlpt)} • ${escapeHtml(item.bab)}</span>
                  ${getStatusBadge(prog.status)}
                </div>

                <div class="flex flex-col items-center justify-center text-center">
                  <div class="font-jp text-[92px] font-black leading-none text-matcha-dark">${escapeHtml(item.kanji)}</div>
                  ${settings.showFrontReadingKanji ? `
                    <div class="mt-4 flex flex-wrap justify-center gap-2">
                      <span class="rounded-xl bg-matcha-mintSoft px-2.5 py-1 text-xs font-semibold text-matcha-dark">On: ${escapeHtml(item.onyomi)}</span>
                      <span class="rounded-xl bg-matcha-mintSoft px-2.5 py-1 text-xs font-semibold text-matcha-dark">Kun: ${escapeHtml(item.kunyomi)}</span>
                    </div>
                  ` : ''}
                </div>

                <p class="text-center text-[11px] font-medium text-matcha-muted">Ketuk kartu untuk membalik • Geser kiri/kanan</p>
              </div>

              <!-- Sisi Belakang -->
              <div class="flashcard-face flashcard-back flex flex-col justify-between rounded-[30px] border border-white/90 bg-gradient-to-br from-white/90 to-[#EAF5E5]/90 p-5 shadow-glassStrong backdrop-blur-2xl overflow-y-auto">
                <div class="flex items-center justify-between">
                  <span class="font-jp text-2xl font-black text-matcha-dark">${escapeHtml(item.kanji)}</span>
                  ${getStatusBadge(prog.status)}
                </div>

                <div class="my-2 space-y-2.5">
                  <div class="rounded-2xl bg-white/80 p-3 border border-white text-center">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-matcha-muted">Arti Bahasa Indonesia</p>
                    <p class="mt-0.5 text-lg font-extrabold text-matcha-dark">${escapeHtml(item.arti)}</p>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div class="rounded-2xl bg-white/75 p-2.5 border border-white">
                      <p class="text-[10px] font-bold uppercase text-matcha-primary">Onyomi</p>
                      <p class="mt-0.5 font-jp text-xs font-bold text-matcha-dark break-words">${escapeHtml(item.onyomi)}</p>
                    </div>
                    <div class="rounded-2xl bg-white/75 p-2.5 border border-white">
                      <p class="text-[10px] font-bold uppercase text-matcha-primary">Kunyomi</p>
                      <p class="mt-0.5 font-jp text-xs font-bold text-matcha-dark break-words">${escapeHtml(item.kunyomi)}</p>
                    </div>
                  </div>

                  ${settings.showExamplesOnBack && item.examples.length > 0 ? `
                    <div class="rounded-2xl bg-white/75 p-2.5 border border-white space-y-1">
                      <p class="text-[10px] font-bold uppercase text-matcha-muted">Contoh Penggunaan</p>
                      ${item.examples.map(ex => `
                        <p class="text-[11px] leading-snug text-matcha-dark">
                          <span class="font-jp font-bold">${escapeHtml(ex.word)}</span>
                          ${ex.reading ? `<span class="font-jp text-matcha-primary">【${escapeHtml(ex.reading)}】</span>` : ''}
                          <span class="text-matcha-muted">${escapeHtml(ex.meaning)}</span>
                        </p>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>

                <p class="text-center text-[10px] font-medium text-matcha-muted">Ketuk lagi untuk melihat sisi depan</p>
              </div>
            </div>
          </div>

          <!-- Tombol Status Hafalan (Belum Hafal, Sedang Dipelajari, Sudah Hafal) -->
          <div class="grid grid-cols-3 gap-2">
            <button onclick="updateKanjiDeckStatus('${item.id}', 'new')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'new' ? 'bg-[#6F7870] text-white shadow-md' : 'border border-white bg-white/75 text-matcha-muted'}">
              Belum Hafal
            </button>
            <button onclick="updateKanjiDeckStatus('${item.id}', 'learning')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'learning' ? 'bg-[#C49C33] text-white shadow-md' : 'border border-white bg-white/75 text-[#87691A]'}">
              Dipelajari
            </button>
            <button onclick="updateKanjiDeckStatus('${item.id}', 'mastered')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'mastered' ? 'bg-matcha-primary text-white shadow-md' : 'border border-white bg-white/75 text-[#2B5D32]'}">
              Sudah Hafal
            </button>

          <div class="flex gap-2.5">

            <button onclick="stepKanjiDeck(1)" class="flex-1 rounded-2xl bg-matcha-dark py-3 text-xs font-bold text-white shadow-md active:scale-95 transition">Berikutnya →</button>
          </div>
        </div>
      `;
    }

    function flipKanjiCard() {
      appState.kanjiUI.flipped = !appState.kanjiUI.flipped;
      const inner = document.querySelector('#kanji-flashcard-stage .flashcard-inner');
      if (inner) inner.classList.toggle('is-flipped', appState.kanjiUI.flipped);
    }

    function stepKanjiDeck(delta) {
      const filtered = getFilteredKanji();
      if (!filtered.length) return;
      appState.kanjiUI.deckIndex = (appState.kanjiUI.deckIndex + delta + filtered.length) % filtered.length;
      appState.kanjiUI.flipped = false;
      const area = document.getElementById('kanji-view-area');
      if (area) {
        area.innerHTML = renderKanjiFlashcardHtml(filtered);
        attachSwipeHandlers('kanji-flashcard-stage', () => stepKanjiDeck(1), () => stepKanjiDeck(-1));
      }
    }

    function updateKanjiDeckStatus(id, status) {
      const item = appState.kanjiList.find(x => x.id === id);
      setItemStatus(id, status, item);
      const filtered = getFilteredKanji();
      const area = document.getElementById('kanji-view-area');
      if (area) {
        area.innerHTML = renderKanjiFlashcardHtml(filtered);
        attachSwipeHandlers('kanji-flashcard-stage', () => stepKanjiDeck(1), () => stepKanjiDeck(-1));
      }
      showToast(status === 'mastered' ? 'Ditandai Sudah Hafal!' : status === 'learning' ? 'Ditandai Sedang Dipelajari' : 'Ditandai Belum Hafal');
    }

    // =========================================================================
    // 8. TAB 3: KOTOBA LEARNING (DAFTAR, FILTER, DETAIL, & FLASHCARD 3D)
    // =========================================================================

    function getFilteredKotoba() {
      const ui = appState.kotobaUI;
      const q = ui.search.trim().toLowerCase();
      return appState.kotobaList.filter(item => {
        const prog = getItemProgress(item.id);
        if (ui.status !== 'all' && prog.status !== ui.status) return false;
        if (ui.bab !== 'all' && item.bab !== ui.bab) return false;
        if (ui.jlpt !== 'all' && item.jlpt !== ui.jlpt) return false;
        if (q) {
          const hay = [item.kata, item.bacaan, item.romaji, item.arti, item.catatan, item.contoh, item.artiContoh, item.bab].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderKotobaTab(container) {
      const ui = appState.kotobaUI;
      const babs = [...new Set(appState.kotobaList.map(k => k.bab))];
      const jlpts = [...new Set(appState.kotobaList.map(k => k.jlpt))];
      const filtered = getFilteredKotoba();

      container.innerHTML = `
        <div class="space-y-3.5 animate-fade-up">
          <!-- Header & Aksi Cepat -->
          <header class="flex items-center justify-between pt-1">
            <div>
              <h1 class="text-xl font-extrabold text-matcha-dark">Koleksi Kotoba</h1>
              <p class="text-xs text-matcha-muted">${filtered.length} dari ${appState.kotobaList.length} kosakata ditampilkan</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="startMemorizeSession({ mode: 'kotoba_meaning', scope: 'kotoba', bab: appState.kotobaUI.bab, count: 10 })" class="rounded-2xl border border-white/90 bg-white/75 px-3 py-2 text-xs font-bold text-matcha-primary shadow-sm active:scale-95 transition">
                Latihan
              </button>
              <button onclick="toggleKotobaMode()" class="rounded-2xl bg-matcha-primary px-3.5 py-2 text-xs font-bold text-white shadow-md active:scale-95 transition">
                ${ui.mode === 'list' ? 'Flashcard' : 'Daftar'}
              </button>
            </div>
          </header>

          <!-- Search Bar -->
          <div class="relative">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-matcha-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"/></svg>
            <input id="kotoba-search-input" type="text" value="${escapeHtml(ui.search)}" placeholder="Cari kata, hiragana, romaji, atau arti..."
              class="w-full rounded-2xl border border-white/90 bg-white/75 py-2.5 pl-10 pr-9 text-xs font-medium text-matcha-dark placeholder-matcha-muted/70 shadow-glass backdrop-blur-xl focus:border-matcha-primary focus:outline-none">
            ${ui.search ? `<button onclick="clearKotobaSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-matcha-muted px-1">✕</button>` : ''}
          </div>

          <!-- Filter Status -->
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${[
              { id: 'all', label: 'Semua' },
              { id: 'new', label: 'Belum Hafal' },
              { id: 'learning', label: 'Sedang Dipelajari' },
              { id: 'mastered', label: 'Sudah Hafal' }
            ].map(st => `
              <button onclick="setKotobaFilter('status', '${st.id}')" class="shrink-0 rounded-full px-3.5 py-1.5 text-[11px] font-bold transition ${ui.status === st.id ? 'bg-matcha-primary text-white shadow-sm' : 'border border-white/80 bg-white/65 text-matcha-muted'}">
                ${st.label}
              </button>
            `).join('')}
          </div>

          <!-- Filter Level JLPT & Kategori Bab -->
          <div class="grid grid-cols-3 gap-2">
            <select onchange="setKotobaFilter('jlpt', this.value)" class="rounded-2xl border border-white/85 bg-white/70 px-3 py-2 text-xs font-semibold text-matcha-dark shadow-sm backdrop-blur-xl focus:outline-none">
              <option value="all" ${ui.jlpt === 'all' ? 'selected' : ''}>Level: Semua</option>
              ${jlpts.map(j => `<option value="${escapeHtml(j)}" ${ui.jlpt === j ? 'selected' : ''}>JLPT ${escapeHtml(j)}</option>`).join('')}
            </select>
            <select onchange="setKotobaFilter('bab', this.value)" class="col-span-2 rounded-2xl border border-white/85 bg-white/70 px-3 py-2 text-xs font-semibold text-matcha-dark shadow-sm backdrop-blur-xl focus:outline-none">
              <option value="all" ${ui.bab === 'all' ? 'selected' : ''}>Semua Kategori (${babs.length} Bab)</option>
              ${babs.map(b => `<option value="${escapeHtml(b)}" ${ui.bab === b ? 'selected' : ''}>${escapeHtml(b)}</option>`).join('')}
            </select>
          </div>

          <!-- Konten Utama: Daftar Kotoba atau Mode Flashcard -->
          <div id="kotoba-view-area">
            ${ui.mode === 'flashcard' ? renderKotobaFlashcardHtml(filtered) : renderKotobaListHtml(filtered)}
          </div>
        </div>
      `;

      const input = document.getElementById('kotoba-search-input');
      if (input) {
        input.addEventListener('input', (e) => {
          appState.kotobaUI.search = e.target.value;
          appState.kotobaUI.deckIndex = 0;
          appState.kotobaUI.flipped = false;
          appState.kotobaUI.renderLimit = 60;
          const area = document.getElementById('kotoba-view-area');
          if (area) {
            const nextFiltered = getFilteredKotoba();
            area.innerHTML = appState.kotobaUI.mode === 'flashcard'
              ? renderKotobaFlashcardHtml(nextFiltered)
              : renderKotobaListHtml(nextFiltered);
          }
        });
      }

      if (ui.mode === 'flashcard') {
        attachSwipeHandlers('kotoba-flashcard-stage', () => stepKotobaDeck(1), () => stepKotobaDeck(-1));
      }
    }

    function clearKotobaSearch() {
      appState.kotobaUI.search = '';
      renderKotobaTab(document.getElementById('main-content'));
    }

    function setKotobaFilter(key, val) {
      appState.kotobaUI[key] = val;
      appState.kotobaUI.deckIndex = 0;
      appState.kotobaUI.flipped = false;
      appState.kotobaUI.deckOrderIds = [];
      appState.kotobaUI.renderLimit = 60;
      renderKotobaTab(document.getElementById('main-content'));
    }

    function toggleKotobaMode() {
      appState.kotobaUI.mode = appState.kotobaUI.mode === 'list' ? 'flashcard' : 'list';
      appState.kotobaUI.deckIndex = 0;
      appState.kotobaUI.flipped = false;
      appState.kotobaUI.deckOrderIds = [];
      renderKotobaTab(document.getElementById('main-content'));
    }

    function loadMoreKotoba() {
      appState.kotobaUI.renderLimit += 80;
      const area = document.getElementById('kotoba-view-area');
      if (area) area.innerHTML = renderKotobaListHtml(getFilteredKotoba());
    }

    function renderKotobaListHtml(filtered) {
      if (filtered.length === 0) {
        return `
          <div class="rounded-[24px] border border-white/80 bg-white/60 p-8 text-center shadow-glass backdrop-blur-xl">
            <p class="text-sm font-bold text-matcha-dark">Kosakata tidak ditemukan</p>
            <p class="mt-1 text-xs text-matcha-muted">Coba kata kunci Hiragana, Kanji, Romaji, atau arti lainnya.</p>
          </div>
        `;
      }

      const showRomaji = appState.userData.settings.showRomaji;
      const limit = appState.kotobaUI.renderLimit;
      const visible = filtered.slice(0, limit);

      const groups = new Map();
      for (const item of visible) {
        if (!groups.has(item.bab)) groups.set(item.bab, []);
        groups.get(item.bab).push(item);
      }

      let html = '<div class="space-y-4">';
      for (const [babName, items] of groups.entries()) {
        // Hitung total asli pada bab ini dari daftar terfilter
        const totalInBab = filtered.filter(x => x.bab === babName);
        const masteredInBab = totalInBab.filter(x => getItemProgress(x.id).status === 'mastered').length;

        html += `
          <div class="space-y-2">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-extrabold uppercase tracking-wide text-matcha-dark">${escapeHtml(babName)}</h2>
              <span class="rounded-full bg-white/75 px-2.5 py-0.5 text-[10px] font-bold text-matcha-primary border border-white">${masteredInBab}/${totalInBab.length} Hafal</span>
            </div>
            <div class="space-y-2">
              ${items.map(item => {
                const prog = getItemProgress(item.id);
                return `
                  <button onclick="openItemDetail('${item.id}')" class="flex w-full items-center justify-between gap-2.5 rounded-[22px] border border-white/85 bg-white/65 px-3.5 py-3 text-left shadow-glass backdrop-blur-xl active:scale-[0.98] transition">
                    <div class="min-w-0 flex-1">
                      <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                        <span class="font-jp text-base font-bold text-matcha-dark">${escapeHtml(item.kata)}</span>
                        ${item.bacaan && item.bacaan !== item.kata ? `<span class="font-jp text-xs font-semibold text-matcha-primary">${escapeHtml(item.bacaan)}</span>` : ''}
                        ${showRomaji && item.romaji ? `<span class="text-[11px] font-medium text-matcha-muted/80">(${escapeHtml(item.romaji)})</span>` : ''}
                      </div>
                      <p class="mt-0.5 text-xs font-semibold text-matcha-muted truncate">${escapeHtml(item.arti)}</p>
                    </div>
                    <div class="shrink-0">${getStatusBadge(prog.status)}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      if (filtered.length > visible.length) {
        html += `
          <button onclick="loadMoreKotoba()" class="w-full rounded-2xl border border-white/90 bg-white/75 py-3 text-xs font-bold text-matcha-primary shadow-glass active:scale-95 transition">
            Muat Lebih Banyak (${visible.length} / ${filtered.length})
          </button>
        `;
      }
      html += '</div>';
      return html;
    }

    function getOrderedKotobaDeck(filtered) {
      const ui = appState.kotobaUI;
      if (appState.userData.settings.shuffleFlashcards && ui.deckOrderIds.length !== filtered.length) {
        const ids = filtered.map(x => x.id);
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        ui.deckOrderIds = ids;
      }
      if (ui.deckOrderIds.length === filtered.length) {
        const map = new Map(filtered.map(x => [x.id, x]));
        const ordered = ui.deckOrderIds.map(id => map.get(id)).filter(Boolean);
        if (ordered.length === filtered.length) return ordered;
      }
      return filtered;
    }

    function shuffleKotobaDeckNow() {
      const filtered = getFilteredKotoba();
      const ids = filtered.map(x => x.id);
      for (let i = ids.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      appState.kotobaUI.deckOrderIds = ids;
      appState.kotobaUI.deckIndex = 0;
      appState.kotobaUI.flipped = false;
      renderKotobaTab(document.getElementById('main-content'));
      showToast('Urutan kartu Kotoba diacak');
    }

    function renderKotobaFlashcardHtml(filtered) {
      if (filtered.length === 0) {
        return `
          <div class="rounded-[24px] border border-white/80 bg-white/60 p-8 text-center shadow-glass backdrop-blur-xl">
            <p class="text-sm font-bold text-matcha-dark">Deck Kotoba Kosong</p>
            <p class="mt-1 text-xs text-matcha-muted">Ubah filter untuk menampilkan kartu Kotoba.</p>
          </div>
        `;
      }

      const deck = getOrderedKotobaDeck(filtered);
      if (appState.kotobaUI.deckIndex >= deck.length) appState.kotobaUI.deckIndex = 0;
      const item = deck[appState.kotobaUI.deckIndex];
      const prog = getItemProgress(item.id);
      const settings = appState.userData.settings;
      const isFlipped = appState.kotobaUI.flipped;

      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-bold text-matcha-muted">Kartu ${appState.kotobaUI.deckIndex + 1} / ${deck.length}</span>
            <button onclick="shuffleKotobaDeckNow()" class="inline-flex items-center gap-1 rounded-full border border-white bg-white/75 px-3 py-1 text-[11px] font-bold text-matcha-primary shadow-sm active:scale-95 transition">
              🔀 Acak Dek
            </button>
          </div>

          <!-- Kartu Flashcard Kotoba 3D -->
          <div id="kotoba-flashcard-stage" onclick="flipKotobaCard()" class="perspective-1000 h-[350px] w-full cursor-pointer select-none">
            <div class="flashcard-inner ${isFlipped ? 'is-flipped' : ''}">
              <!-- Depan -->
              <div class="flashcard-face flex flex-col justify-between rounded-[30px] border border-white/90 bg-white/75 p-5 shadow-glassStrong backdrop-blur-2xl">
                <div class="flex items-center justify-between">
                  <span class="rounded-full bg-matcha-mintSoft px-2.5 py-1 text-[10px] font-bold text-matcha-primary">${escapeHtml(item.jlpt)} • ${escapeHtml(item.bab)}</span>
                  ${getStatusBadge(prog.status)}
                </div>

                <div class="flex flex-col items-center justify-center text-center px-2">
                  <div class="font-jp text-4xl font-black leading-tight text-matcha-dark break-words">${escapeHtml(item.kata)}</div>
                  ${settings.showFrontReadingKotoba ? `<p class="mt-3 font-jp text-base font-bold text-matcha-primary">${escapeHtml(item.bacaan)}</p>` : ''}
                  ${settings.showFrontReadingKotoba && settings.showRomaji ? `<p class="mt-1 text-xs font-medium text-matcha-muted">${escapeHtml(item.romaji)}</p>` : ''}
                </div>

                <p class="text-center text-[11px] font-medium text-matcha-muted">Ketuk kartu untuk melihat bacaan &amp; arti</p>
              </div>

              <!-- Belakang -->
              <div class="flashcard-face flashcard-back flex flex-col justify-between rounded-[30px] border border-white/90 bg-gradient-to-br from-white/90 to-[#EAF5E5]/90 p-5 shadow-glassStrong backdrop-blur-2xl overflow-y-auto">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-jp text-lg font-extrabold text-matcha-dark truncate">${escapeHtml(item.kata)}</span>
                  ${getStatusBadge(prog.status)}
                </div>

                <div class="my-2 space-y-2.5">
                  <div class="rounded-2xl bg-white/80 p-3 border border-white text-center">
                    <p class="font-jp text-base font-bold text-matcha-primary">${escapeHtml(item.bacaan)}</p>
                    ${settings.showRomaji ? `<p class="text-[11px] font-medium text-matcha-muted">${escapeHtml(item.romaji)}</p>` : ''}
                    <p class="mt-1.5 text-lg font-extrabold text-matcha-dark">${escapeHtml(item.arti)}</p>
                  </div>

                  ${item.catatan ? `
                    <div class="rounded-2xl bg-[#F4F0DF]/90 p-2.5 border border-white">
                      <p class="text-[10px] font-bold uppercase text-[#82681F]">Konteks / Catatan</p>
                      <p class="mt-0.5 text-[11px] leading-snug text-matcha-dark">${escapeHtml(item.catatan)}</p>
                    </div>
                  ` : ''}

                  ${settings.showExamplesOnBack && item.contoh ? `
                    <div class="rounded-2xl bg-white/80 p-2.5 border border-white">
                      <p class="text-[10px] font-bold uppercase text-matcha-muted">Contoh Kalimat</p>
                      <p class="mt-1 font-jp text-xs font-bold text-matcha-dark">${escapeHtml(item.contoh)}</p>
                      <p class="mt-0.5 text-[11px] text-matcha-muted">${escapeHtml(item.artiContoh)}</p>
                    </div>
                  ` : ''}
                </div>

                <p class="text-center text-[10px] font-medium text-matcha-muted">Ketuk lagi untuk melihat sisi depan</p>
              </div>
            </div>
          </div>

          <!-- Tombol Status -->
          <div class="grid grid-cols-3 gap-2">
            <button onclick="updateKotobaDeckStatus('${item.id}', 'new')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'new' ? 'bg-[#6F7870] text-white shadow-md' : 'border border-white bg-white/75 text-matcha-muted'}">
              Belum Hafal
            </button>
            <button onclick="updateKotobaDeckStatus('${item.id}', 'learning')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'learning' ? 'bg-[#C49C33] text-white shadow-md' : 'border border-white bg-white/75 text-[#87691A]'}">
              Dipelajari
            </button>
            <button onclick="updateKotobaDeckStatus('${item.id}', 'mastered')" class="rounded-2xl py-2.5 px-2 text-[11px] font-bold transition active:scale-95 ${prog.status === 'mastered' ? 'bg-matcha-primary text-white shadow-md' : 'border border-white bg-white/75 text-[#2B5D32]'}">
              Sudah Hafal
            </button>
          </div>

          <div class="flex gap-2.5">
            <button onclick="stepKotobaDeck(-1)" class="flex-1 rounded-2xl border border-white/90 bg-white/75 py-3 text-xs font-bold text-matcha-dark shadow-sm active:scale-95 transition">← Sebelumnya</button>
            <button onclick="stepKotobaDeck(1)" class="flex-1 rounded-2xl bg-matcha-dark py-3 text-xs font-bold text-white shadow-md active:scale-95 transition">Berikutnya →</button>
          </div>
        </div>
      `;
    }

    function flipKotobaCard() {
      appState.kotobaUI.flipped = !appState.kotobaUI.flipped;
      const inner = document.querySelector('#kotoba-flashcard-stage .flashcard-inner');
      if (inner) inner.classList.toggle('is-flipped', appState.kotobaUI.flipped);
    }

    function stepKotobaDeck(delta) {
      const filtered = getFilteredKotoba();
      if (!filtered.length) return;
      appState.kotobaUI.deckIndex = (appState.kotobaUI.deckIndex + delta + filtered.length) % filtered.length;
      appState.kotobaUI.flipped = false;
      const area = document.getElementById('kotoba-view-area');
      if (area) {
        area.innerHTML = renderKotobaFlashcardHtml(filtered);
        attachSwipeHandlers('kotoba-flashcard-stage', () => stepKotobaDeck(1), () => stepKotobaDeck(-1));
      }
    }

    function updateKotobaDeckStatus(id, status) {
      const item = appState.kotobaList.find(x => x.id === id);
      setItemStatus(id, status, item);
      const filtered = getFilteredKotoba();
      const area = document.getElementById('kotoba-view-area');
      if (area) {
        area.innerHTML = renderKotobaFlashcardHtml(filtered);
        attachSwipeHandlers('kotoba-flashcard-stage', () => stepKotobaDeck(1), () => stepKotobaDeck(-1));
      }
      showToast(status === 'mastered' ? 'Ditandai Sudah Hafal!' : status === 'learning' ? 'Ditandai Sedang Dipelajari' : 'Ditandai Belum Hafal');
    }

    // =========================================================================
    // 9. MODAL DETAIL ITEM (KANJI & KOTOBA)
    // =========================================================================

    function findItemById(id) {
      return appState.kanjiList.find(x => x.id === id) || appState.kotobaList.find(x => x.id === id) || null;
    }

    function openItemDetail(id) {
      const item = findItemById(id);
      if (!item) return;

      // Perbarui Continue Learning saat item dibuka
      appState.userData.lastStudied = {
        type: item.type,
        id: item.id,
        label: item.type === 'kanji' ? item.kanji : item.kata,
        sub: item.arti,
        bab: item.bab,
      };
      saveUserData();

      const prog = getItemProgress(item.id);
      const modal = document.getElementById('detail-modal');
      const body = document.getElementById('detail-modal-body');

      if (item.type === 'kanji') {
        body.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-start justify-between">
              <div>
                <span class="rounded-full bg-matcha-mintSoft px-2.5 py-1 text-[10px] font-bold text-matcha-primary">${escapeHtml(item.jlpt)} • ${escapeHtml(item.bab)}</span>
                <p class="mt-1.5 text-[11px] font-medium text-matcha-muted">Tag: ${escapeHtml(item.tags)}</p>
              </div>
              <button onclick="closeDetailModal()" class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-sm font-bold text-matcha-muted shadow-sm">✕</button>
            </div>

            <!-- Kanji Utama -->
            <div class="flex flex-col items-center rounded-[28px] border border-white bg-white/85 py-6 px-4 shadow-glass">
              <div class="font-jp text-[84px] font-black leading-none text-matcha-dark">${escapeHtml(item.kanji)}</div>
              <p class="mt-3 text-xl font-extrabold text-matcha-dark text-center">${escapeHtml(item.arti)}</p>
            </div>

            <!-- Onyomi & Kunyomi -->
            <div class="grid grid-cols-2 gap-2.5">
              <div class="rounded-2xl border border-white bg-white/80 p-3.5 shadow-sm">
                <p class="text-[10px] font-bold uppercase tracking-wider text-matcha-primary">Onyomi (音読み)</p>
                <p class="mt-1 font-jp text-sm font-bold text-matcha-dark">${escapeHtml(item.onyomi)}</p>
              </div>
              <div class="rounded-2xl border border-white bg-white/80 p-3.5 shadow-sm">
                <p class="text-[10px] font-bold uppercase tracking-wider text-matcha-primary">Kunyomi (訓読み)</p>
                <p class="mt-1 font-jp text-sm font-bold text-matcha-dark">${escapeHtml(item.kunyomi)}</p>
              </div>
            </div>

            <!-- Contoh Penggunaan dari TXT -->
            <div class="rounded-2xl border border-white bg-white/80 p-3.5 shadow-sm space-y-2">
              <p class="text-[10px] font-bold uppercase tracking-wider text-matcha-muted">Contoh Penggunaan</p>
              ${item.examples.length ? item.examples.map(ex => `
                <div class="flex items-baseline justify-between gap-2 rounded-xl bg-matcha-mintSoft/65 px-3 py-2">
                  <div>
                    <span class="font-jp text-sm font-bold text-matcha-dark">${escapeHtml(ex.word)}</span>
                    ${ex.reading ? `<span class="font-jp text-xs font-semibold text-matcha-primary">【${escapeHtml(ex.reading)}】</span>` : ''}
                  </div>
                  <span class="text-xs font-medium text-matcha-muted text-right">${escapeHtml(ex.meaning)}</span>
                </div>
              `).join('') : '<p class="text-xs text-matcha-muted">Tidak ada contoh tambahan.</p>'}
            </div>

            <!-- Statistik Akurasi & Tombol Status -->
            <div class="space-y-2 pt-1">
              <div class="flex items-center justify-between text-[11px] font-semibold text-matcha-muted px-1">
                <span>Status Hafalan</span>
                <span>Benar ${prog.correct}x • Salah ${prog.wrong}x</span>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="setStatusFromModal('${item.id}', 'new')" class="rounded-2xl py-3 text-xs font-bold transition active:scale-95 ${prog.status === 'new' ? 'bg-[#6F7870] text-white shadow-md' : 'border border-white bg-white text-matcha-muted'}">Belum Hafal</button>
                <button onclick="setStatusFromModal('${item.id}', 'learning')" class="rounded-2xl py-3 text-xs font-bold transition active:scale-95 ${prog.status === 'learning' ? 'bg-[#C49C33] text-white shadow-md' : 'border border-white bg-white text-[#87691A]'}">Dipelajari</button>
                <button onclick="setStatusFromModal('${item.id}', 'mastered')" class="rounded-2xl py-3 text-xs font-bold transition active:scale-95 ${prog.status === 'mastered' ? 'bg-matcha-primary text-white shadow-md' : 'border border-white bg-white text-[#2B5D32]'}">Sudah Hafal</button>
              </div>
            </div>
          </div>
        `;
      } else {
        body.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-start justify-between">
              <div>
                <span class="rounded-full bg-matcha-mintSoft px-2.5 py-1 text-[10px] font-bold text-matcha-primary">${escapeHtml(item.jlpt)} • ${escapeHtml(item.bab)}</span>
                <p class="mt-1.5 text-[11px] font-medium text-matcha-muted">Tag: ${escapeHtml(item.tags)}</p>
              </div>
              <button onclick="closeDetailModal()" class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-sm font-bold text-matcha-muted shadow-sm">✕</button>
            </div>

            <!-- Kotoba Utama -->
            <div class="flex flex-col items-center rounded-[28px] border border-white bg-white/85 py-6 px-4 text-center shadow-glass">
              <div class="font-jp text-4xl font-black text-matcha-dark">${escapeHtml(item.kata)}</div>
              <p class="mt-2 font-jp text-lg font-bold text-matcha-primary">${escapeHtml(item.bacaan)}</p>
              ${item.romaji ? `<p class="mt-0.5 text-xs font-semibold text-matcha-muted">${escapeHtml(item.romaji)}</p>` : ''}
              <div class="mt-3 h-px w-16 bg-matcha-sage/25"></div>
              <p class="mt-3 text-xl font-extrabold text-matcha-dark">${escapeHtml(item.arti)}</p>
            </div>

            ${item.catatan ? `

    function syncLaunchScopeOptions() {
      const mode = document.getElementById('launch-mode')?.value;
      const scopeEl = document.getElementById('launch-scope');
      if (!scopeEl) return;
      if (mode === 'kanji_meaning') scopeEl.value = 'kanji';
      else if (mode === 'kotoba_meaning') scopeEl.value = 'kotoba';
      syncLaunchBabOptions();

    function syncLaunchBabOptions() {
      const scope = document.getElementById('launch-scope')?.value || 'mixed';
      const babEl = document.getElementById('launch-bab');
      if (!babEl) return;
      let options = '<option value="all">Semua Bab</option>';
      if (scope === 'kanji' || scope === 'mixed') {
        (window._launchKanjiBabs || []).forEach(b => {
          options += `<option value="${escapeHtml(b)}">[Kanji] ${escapeHtml(b)}</option>`;
        });
      }
      if (scope === 'kotoba' || scope === 'mixed') {
        (window._launchKotobaBabs || []).forEach(b => {
          options += `<option value="${escapeHtml(b)}">[Kotoba] ${escapeHtml(b)}</option>`;
        });
      }
      babEl.innerHTML = options;
    }

    function launchConfiguredSession() {
      const mode = document.getElementById('launch-mode').value;
      const scope = document.getElementById('launch-scope').value;
      const count = parseInt(document.getElementById('launch-count').value, 10) || 15;
      const bab = document.getElementById('launch-bab').value;
      const prioritizeUnmastered = document.getElementById('launch-unmastered').checked;
      startMemorizeSession({ mode, scope, bab, count, prioritizeUnmastered });
    }

    function closeMemorizeModal() {
      const modal = document.getElementById('memorize-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      appState.session = null;
      renderCurrentTab();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /**
     * Memulai sesi Memorization Mode.
     * Mode: 'flashcard' | 'kanji_meaning' | 'reading' | 'kotoba_meaning' | 'review'
     */
    function startMemorizeSession({ mode = 'flashcard', scope = 'mixed', bab = 'all', count = 15, prioritizeUnmastered = true, customQueue = null }) {
      let pool = [];
      if (customQueue && customQueue.length > 0) {
        pool = customQueue;
      } else {
        if (mode === 'kanji_meaning' || scope === 'kanji') {
          pool = [...appState.kanjiList];
        } else if (mode === 'kotoba_meaning' || scope === 'kotoba') {
          pool = [...appState.kotobaList];
        } else {
          pool = [...appState.kanjiList, ...appState.kotobaList];
        }

        if (bab && bab !== 'all') {
          const babFiltered = pool.filter(x => x.bab === bab);
          if (babFiltered.length > 0) pool = babFiltered;
        }

        if (mode === 'review') {
          const needReview = pool.filter(x => {
            const p = getItemProgress(x.id);
            return p.status !== 'mastered' || p.wrong > 0;
          });
          if (needReview.length > 0) pool = needReview;
        } else if (prioritizeUnmastered) {
          const unmastered = pool.filter(x => getItemProgress(x.id).status !== 'mastered');
          if (unmastered.length >= 4) pool = unmastered;
        }

        // Urutkan agar materi dengan kesalahan terbanyak muncul lebih sering
        pool = shuffleArray(pool).sort((a, b) => {
          const wa = getItemProgress(a.id).wrong;
          const wb = getItemProgress(b.id).wrong;
          if (mode === 'review') return wb - wa;
          // Beri peluang lebih besar untuk yang sering salah namun tetap acak
          return (wb > 0 ? -1 : 0) - (wa > 0 ? -1 : 0);
        });

        pool = pool.slice(0, Math.min(count, pool.length));
      }

      if (pool.length === 0) {
        showToast('Tidak ada materi yang tersedia untuk sesi ini.');
        return;
      }

      appState.session = {
        mode,
        scope,
        queue: pool,
        index: 0,
        flipped: false,
        answered: false,
        selectedOption: null,
        correctCount: 0,
        wrongCount: 0,
        wrongItemsMap: new Map(), // Menyimpan item yang salah untuk diulang
        requeuedIds: new Set(),   // Mencegah loop tak terbatas dalam 1 putaran, lalu menawarkan ronde ulangan
        currentQuestion: null,
        finished: false,
      };

      const modal = document.getElementById('memorize-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderMemorizeSession();
    }

    function getReadingLabel(item) {
      if (item.type === 'kanji') {
        const parts = [];
        if (item.onyomi && item.onyomi !== '-') parts.push(`On: ${item.onyomi}`);
        if (item.kunyomi && item.kunyomi !== '-') parts.push(`Kun: ${item.kunyomi}`);
        return parts.join(' • ') || '-';
      }
      return item.bacaan;
    }

    function buildQuizQuestion(item, mode) {
      // Untuk mode review, pilih tipe soal otomatis sesuai jenis item (arti atau bacaan)
      let activeType = mode;
      if (mode === 'review') {
        activeType = Math.random() < 0.55
          ? (item.type === 'kanji' ? 'kanji_meaning' : 'kotoba_meaning')
          : 'reading';
      }

      const sourcePool = item.type === 'kanji' ? appState.kanjiList : appState.kotobaList;
      let promptMain = '';
      let promptHint = '';
      let promptLabel = '';
      let correctAnswer = '';
      let candidateValues = [];

      if (activeType === 'kanji_meaning') {
        promptLabel = 'Tebak Arti Kanji';
        promptMain = item.kanji;
        promptHint = `${item.bab}`;
        correctAnswer = item.arti;
        candidateValues = sourcePool.filter(x => x.id !== item.id && x.arti !== correctAnswer).map(x => x.arti);
      } else if (activeType === 'kotoba_meaning') {
        promptLabel = 'Tebak Arti Kotoba';
        promptMain = item.kata;
        promptHint = item.bacaan !== item.kata ? item.bacaan : item.bab;
        correctAnswer = item.arti;
        candidateValues = sourcePool.filter(x => x.id !== item.id && x.arti !== correctAnswer).map(x => x.arti);
      } else {
        // Tebak Cara Baca
        promptLabel = 'Tebak Cara Baca';
        promptMain = item.type === 'kanji' ? item.kanji : item.kata;
        promptHint = `Arti: ${item.arti}`;
        correctAnswer = getReadingLabel(item);
        candidateValues = sourcePool
          .filter(x => x.id !== item.id)
          .map(getReadingLabel)
          .filter(v => v && v !== correctAnswer);
      }

      const uniqueDistractors = shuffleArray([...new Set(candidateValues)]).slice(0, 3);
      const options = shuffleArray([correctAnswer, ...uniqueDistractors]);

      return { activeType, promptLabel, promptMain, promptHint, correctAnswer, options };
    }

    function getSessionModeTitle(mode) {
      switch (mode) {
        case 'flashcard': return 'Flashcard Acak';
        case 'kanji_meaning': return 'Tebak Arti Kanji';
        case 'reading': return 'Tebak Cara Baca';
        case 'kotoba_meaning': return 'Tebak Arti Kotoba';
        case 'review': return 'Mode Review';
        default: return 'Latihan Hafalan';
      }
    }

    function renderMemorizeSession() {
      const s = appState.session;
      const body = document.getElementById('memorize-modal-body');
      if (!s) return;

      if (s.finished || s.index >= s.queue.length) {
        renderSessionSummary(body);
        return;

      const item = s.queue[s.index];

      // MODE 1: FLASHCARD ACAK

                  </div>
                  <p class="text-center text-xs font-medium text-matcha-muted">Ketuk kartu untuk memeriksa jawaban</p>
                </div>

                <!-- Belakang -->
                <div class="flashcard-face flashcard-back flex flex-col justify-between rounded-[30px] border border-white/90 bg-gradient-to-br from-white/95 to-[#EAF5E5]/95 p-5 shadow-glassStrong backdrop-blur-2xl overflow-y-auto">
                  <div class="flex items-center justify-between">
                    <span class="font-jp text-2xl font-black text-matcha-dark">${escapeHtml(isKanji ? item.kanji : item.kata)}</span>
                    ${getStatusBadge(prog.status)}
                  </div>
                  <div class="my-2 space-y-2.5">
                    <div class="rounded-2xl bg-white/85 p-3.5 text-center border border-white">
                      <p class="text-xs font-bold text-matcha-primary font-jp">${escapeHtml(getReadingLabel(item))}</p>
                      ${!isKanji && item.romaji ? `<p class="text-[11px] text-matcha-muted">${escapeHtml(item.romaji)}</p>` : ''}
                      <p class="mt-1.5 text-xl font-extrabold text-matcha-dark">${escapeHtml(item.arti)}</p>
                    </div>
                    ${isKanji && item.examples.length > 0 ? `

                      </div>
                    ` : ''}
                    ${!isKanji && item.contoh ? `
                      <div class="rounded-2xl bg-white/80 p-3 border border-white">
                        <p class="font-jp text-xs font-bold text-matcha-dark">${escapeHtml(item.contoh)}</p>
                        <p class="mt-0.5 text-[11px] text-matcha-muted">${escapeHtml(item.artiContoh)}</p>
                      </div>
                    ` : ''}
                  </div>
                  <p class="text-center text-[10px] text-matcha-muted">Pilih penilaian di bawah ini</p>

            <div class="space-y-2 pb-2">

      // MODE 2-5: PILIHAN GANDA (Tebak Arti Kanji / Cara Baca / Arti Kotoba / Review)
      if (!s.currentQuestion) {

      body.innerHTML = `

              <div class="flex items-center justify-center gap-2">
                <span class="rounded-full bg-matcha-mintSoft px-3 py-1 text-[10px] font-bold uppercase tracking-wider text-matcha-primary">${escapeHtml(q.promptLabel)}</span>
                ${prog.wrong > 0 ? `<span class="rounded-full bg-[#FCE6E6] px-2.5 py-0.5 text-[10px] font-bold text-[#B34040]">Sering Salah (${prog.wrong}x)</span>` : ''}
              </div>
              <div class="mt-4 font-jp ${item.type === 'kanji' ? 'text-7xl' : 'text-3xl'} font-black leading-tight text-matcha-dark">${escapeHtml(q.promptMain)}</div>

                  <button ${s.answered ? 'disabled' : ''} onclick="answerQuizOption(${idx})" class="flex w-full items-center justify-between gap-3 rounded-[20px] border p-3.5 text-left shadow-sm backdrop-blur-xl transition active:scale-[0.98] ${cls}">

                </p>
                <p class="mt-0.5 text-matcha-muted">
                  ${escapeHtml(item.type === 'kanji' ? `${item.kanji} (${getReadingLabel(item)}) = ${item.arti}` : `${item.kata}【${item.bacaan}】= ${item.arti}`)}

              </div>

          </div>

          <div class="pb-2">
            ${s.answered ? `

                ${s.index + 1 >= total ? 'Lihat Hasil Latihan →' : 'Lanjut ke Soal Berikutnya →'}

            ` : `

            `}
          </div>
        </div>
      `;
    }

    function flipSessionCard() {
      if (!appState.session) return;
      appState.session.flipped = !appState.session.flipped;
      const inner = document.querySelector('#session-flashcard-stage .flashcard-inner');
      if (inner) inner.classList.toggle('is-flipped', appState.session.flipped);
    }

    function recordSessionAnswer(item, isCorrect) {
      const s = appState.session;
      const prev = getItemProgress(item.id);
      const nextStatus = isCorrect
        ? (prev.status === 'new' ? 'learning' : prev.status)
        : (prev.status === 'mastered' ? 'learning' : prev.status);

      appState.userData.progress[item.id] = {
        status: nextStatus,
        correct: prev.correct + (isCorrect ? 1 : 0),
        wrong: prev.wrong + (isCorrect ? 0 : 1),
        lastAt: Date.now(),
      };
      appState.userData.lastStudied = {
        type: item.type,
        id: item.id,
        label: item.type === 'kanji' ? item.kanji : item.kata,
        sub: item.arti,
        bab: item.bab,
      };
      recordDailyReview(isCorrect, true);

      if (isCorrect) {
        s.correctCount++;
      } else {
        s.wrongCount++;
        s.wrongItemsMap.set(item.id, item);
        // Ulangi materi yang salah di akhir antrean sesi (maks 1x pengulangan otomatis dalam sesi)
        if (!s.requeuedIds.has(item.id)) {
          s.requeuedIds.add(item.id);
          s.queue.push(item);
        }
      }
      saveUserData();
    }

    function gradeSessionFlashcard(isCorrect) {
      const s = appState.session;
      if (!s) return;
      const item = s.queue[s.index];
      recordSessionAnswer(item, isCorrect);
      if (!isCorrect) showToast('Kartu dijadwalkan ulang di akhir sesi');

      s.index++;
      s.flipped = false;
      if (s.index >= s.queue.length) {
        finishSession();
      } else {
        renderMemorizeSession();
      }
    }

    function answerQuizOption(optionIdx) {
      const s = appState.session;
      if (!s || s.answered || !s.currentQuestion) return;
      const item = s.queue[s.index];
      const chosen = s.currentQuestion.options[optionIdx];
      const isCorrect = chosen === s.currentQuestion.correctAnswer;

      s.answered = true;
      s.selectedOption = chosen;
      recordSessionAnswer(item, isCorrect);
      renderMemorizeSession();
    }

    function advanceQuizQuestion() {
      const s = appState.session;
      if (!s) return;
      s.index++;
      s.answered = false;
      s.selectedOption = null;
      s.currentQuestion = null;
      if (s.index >= s.queue.length) {
        finishSession();
      } else {
        renderMemorizeSession();
      }
    }

    function finishSession() {
      const s = appState.session;
      s.finished = true;
      const totalAnswered = s.correctCount + s.wrongCount;
      pushActivityLog(
        getSessionModeTitle(s.mode),
        `${totalAnswered} materi diuji`,
        s.correctCount,
        totalAnswered
      );
      renderMemorizeSession();
    }
