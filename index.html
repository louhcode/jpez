        const categoryNav = document.getElementById('category-nav');
        const vocabGrid = document.getElementById('vocab-grid');
        const currentCategoryTitle = document.getElementById('current-category-title');
        const itemCount = document.getElementById('item-count');
        
        let currentCategoryId = 1;
        let currentView = 'Kotoba';

        function switchView(viewName) {
            currentView = viewName;
            
            // Update Navigation active state
            const navButtons = document.querySelectorAll('.nav-btn');
            navButtons.forEach(btn => {
                if (btn.id === `nav-${viewName}`) {
                    btn.classList.add('bg-black', 'text-white');
                } else {
                    btn.classList.remove('bg-black', 'text-white');
                }
            });

            // Toggle Main Views
            if (viewName === 'Kotoba') {
                document.getElementById('view-kotoba').classList.remove('hidden');
                document.getElementById('view-kotoba').classList.add('block');
                document.getElementById('view-soon').classList.remove('flex');
                document.getElementById('view-soon').classList.add('hidden');
            } else {
                document.getElementById('view-kotoba').classList.remove('block');
                document.getElementById('view-kotoba').classList.add('hidden');
                document.getElementById('view-soon').classList.remove('hidden');
                document.getElementById('view-soon').classList.add('flex');
                document.getElementById('soon-title').textContent = viewName;
            }
        }

        function renderCategories() {
            categoryNav.innerHTML = '';
            vocabData.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat.id === currentCategoryId;
                
                btn.className = `flex-shrink-0 px-3 py-1.5 border-2 border-black font-bold text-sm transition-colors ${
                    isActive 
                    ? 'bg-black text-white' 
                    : 'bg-white text-black hover:bg-gray-100'
                }`;
                btn.textContent = cat.title;
                
                btn.onclick = () => {
                    selectCategory(cat.id);
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };
                
                categoryNav.appendChild(btn);
            });
        }

        function renderVocab(categoryId) {
            const category = vocabData.find(c => c.id === categoryId);
            if (!category) return;

            currentCategoryTitle.textContent = category.title.replace(/[0-9]/g, '').trim(); 
            itemCount.textContent = category.items.length;
            
            vocabGrid.innerHTML = '';

            category.items.forEach((item) => {
                const card = document.createElement('div');
                
                // Compact Neo-brutalism Card Style
                card.className = 'border-2 border-black p-3 bg-white flex flex-col h-full hover:shadow-solid hover:-translate-y-1 transition-all';
                
                let noteHtml = '';
                if (item.note) {
                    noteHtml = `
                        <div class="mt-2 pt-2 border-t-2 border-dashed border-gray-300">
                            <label class="cursor-pointer text-[10px] font-bold text-gray-500 uppercase tracking-wider block hover:text-black transition-colors">
                                <input type="checkbox" class="peer hidden note-toggle">
                                <span>[+] Aturan Penggunaan</span>
                                <div class="hidden peer-checked:block note-content mt-1 p-1.5 bg-gray-100 border border-black text-[11px] font-medium text-black normal-case leading-tight">
                                    ${item.note}
                                </div>
                            </label>
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="text-2xl md:text-3xl font-jp font-normal text-center mb-1 text-black">
                        ${item.j}
                    </div>
                    <div class="text-[11px] md:text-xs text-center text-gray-500 font-mono tracking-tighter mb-2">
                        ${item.r}
                    </div>
                    <div class="border-t-2 border-black pt-2 text-sm md:text-base font-bold text-center mt-auto leading-tight">
                        ${item.m}
                    </div>
                    ${noteHtml}
                `;
                vocabGrid.appendChild(card);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategory(id) {
            currentCategoryId = id;
            renderCategories();
            renderVocab(id);
        }

        // Initialize
        renderCategories();
        renderVocab(currentCategoryId);

    </script>
