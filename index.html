            else if (reads.length === kIdx.length) kIdx.forEach((n, k) => map[n] = reads[k]);
            else kIdx.forEach(n => map[n] = reads[0]);
            const html = segs.map((s, n) => (hasKanji(s) && map[n]) ? `<ruby>${esc(s)}<rt>${esc(map[n])}</rt></ruby>` : esc(s)).join('<span class="mx-1">、</span>');
            const kana = segs.map((s, n) => hasKanji(s) ? map[n] : s).join('、');
            return { html, kana };
        }

        function openKanjiModal(item) {
            const f = buildFurigana(item.j, item.r);
            document.getElementById('km-word').innerHTML = f.html;
            document.getElementById('km-furigana').textContent = f.kana;
            document.getElementById('km-romaji').textContent = item.r;
            document.getElementById('km-arti').textContent = item.m;
            const note = document.getElementById('km-note');
            if (item.note) { note.innerHTML = item.note; note.classList.remove('hidden'); } else note.classList.add('hidden');
            document.getElementById('kanji-modal').classList.add('open');
        }
        function closeKanjiModal(e) {
            document.getElementById('kanji-modal').classList.remove('open');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeKanjiModal(); });


        // ==========================================
        // CHECKLIST PENGUASAAN KOTOBA
        // ==========================================
        let doneSet = new Set();
        try { doneSet = new Set(JSON.parse(localStorage.getItem('n5_kotobaDone') || '[]')); } catch (e) {}
        function saveDone() { try { localStorage.setItem('n5_kotobaDone', JSON.stringify([...doneSet])); } catch (e) {} }
        const itemKey = (catId, idx) => catId + ':' + idx;
        function catDoneCount(cat) { return cat.items.filter((_, i) => doneSet.has(itemKey(cat.id, i))).length; }

        function updateCategoryProgress() {
            const cat = vocabData.find(c => c.id === currentKotobaCategoryId);
            if (!cat) return;
            const done = catDoneCount(cat), total = cat.items.length;
            document.getElementById('cat-progress-text').textContent = done + '/' + total;
            document.getElementById('cat-progress-bar').style.width = (total ? done / total * 100 : 0) + '%';
            document.getElementById('cat-toggle-all').textContent = done === total ? 'Hapus semua' : 'Centang semua';
            // tanda ✓ pada tombol kategori yang selesai
            document.querySelectorAll('#category-nav button').forEach((b, n) => {
                const c = vocabData[n];
                if (c) b.textContent = c.title + (catDoneCount(c) === c.items.length ? ' ✓' : '');
            });
        }

        function toggleItemDone(catId, idx, card, checked) {
            const k = itemKey(catId, idx);
            if (checked) doneSet.add(k); else doneSet.delete(k);
            card.classList.toggle('bg-gray-100', checked);
            saveDone();
            updateCategoryProgress();
        }

        document.getElementById('cat-toggle-all').addEventListener('click', () => {
            const cat = vocabData.find(c => c.id === currentKotobaCategoryId);
            const allDone = catDoneCount(cat) === cat.items.length;
            cat.items.forEach((_, i) => { allDone ? doneSet.delete(itemKey(cat.id, i)) : doneSet.add(itemKey(cat.id, i)); });
            saveDone();
            renderVocab(cat.id);
        });
        document.getElementById('reset-progress').addEventListener('click', () => {
            if (!confirm('Hapus semua progress kotoba?')) return;
            doneSet.clear(); saveDone();
            renderVocab(currentKotobaCategoryId);
        });

        function renderHome() {
            let done = 0, total = 0;
            const list = document.getElementById('home-cat-list');
            list.innerHTML = '';
            vocabData.forEach(cat => {
                const d = catDoneCount(cat), t = cat.items.length;
                done += d; total += t;
                const pct = t ? Math.round(d / t * 100) : 0;
                const row = document.createElement('button');
                row.className = 'text-left w-full group';
                row.innerHTML = `
                    <div class="flex justify-between text-[11px] font-bold uppercase mb-0.5 group-hover:underline">
                        <span>${cat.title}</span><span class="font-mono">${d}/${t}</span>
                    </div>
                    <div class="w-full h-2.5 border-2 border-black bg-white"><div class="h-full bg-black" style="width:${pct}%"></div></div>`;
                row.addEventListener('click', () => { selectKotobaCategory(cat.id); switchView('Kotoba'); });
                list.appendChild(row);
            });
            const pctAll = total ? Math.round(done / total * 100) : 0;
            document.getElementById('home-total-text').textContent = done + '/' + total;
            document.getElementById('home-total-bar').style.width = pctAll + '%';
            document.getElementById('home-total-percent').textContent = pctAll + '%';
        }

        // ==========================================
        // TANGGAL & JAM BAHASA JEPANG
        // ==========================================
        const U = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
        const tensRead = (n) => ['', 'じゅう', 'にじゅう', 'さんじゅう', 'よんじゅう', 'ごじゅう'][n];
        function numRead(n, units) { // 1-59
            const t = Math.floor(n / 10), u = n % 10;
            return tensRead(t) + (u ? units[u] : '');
        }
        const rt = (base, reading) => `<ruby>${base}<rt>${reading}</rt></ruby>`;
        const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
        const WEEK_R = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];

        function yearRead(y) { // 2000-2099
            const u = [...U]; u[4] = 'よ'; u[9] = 'きゅう';
            const r = y % 100;
            return 'にせん' + (r ? numRead(r, u) : '');
        }
        function reiwaRead(n) {
            if (n === 1) return 'がん';
            const u = [...U]; u[4] = 'よ'; u[9] = 'きゅう';
            return numRead(n, u);
        }
        function monthRead(m) {
            const u = [...U]; u[4] = 'し'; u[7] = 'しち'; u[9] = 'く';
            return numRead(m, u) + 'がつ';
        }
        function dayRead(d) {
            const sp = { 1: 'ついたち', 2: 'ふつか', 3: 'みっか', 4: 'よっか', 5: 'いつか', 6: 'むいか', 7: 'なのか', 8: 'ようか', 9: 'ここのか', 10: 'とおか', 14: 'じゅうよっか', 20: 'はつか', 24: 'にじゅうよっか' };
            if (sp[d]) return sp[d];
            const u = [...U]; u[4] = 'よん'; u[7] = 'しち'; u[9] = 'く';
            return numRead(d, u) + 'にち';
        }
        function hourRead(h) { // 1-12
            const u = [...U]; u[4] = 'よ'; u[7] = 'しち'; u[9] = 'く';
            return numRead(h, u) + 'じ';
        }
        function minuteRead(m) {
            if (m === 0) return 'れいふん';
            const tens = Math.floor(m / 10), u = m % 10;
            const unitPun = ['', 'いっぷん', 'にふん', 'さんぷん', 'よんぷん', 'ごふん', 'ろっぷん', 'ななふん', 'はっぷん', 'きゅうふん'];
            if (u === 0) return ['', 'じゅっぷん', 'にじゅっぷん', 'さんじゅっぷん', 'よんじゅっぷん', 'ごじゅっぷん'][tens];
            return tensRead(tens) + unitPun[u];
        }

        function updateJapaneseClock() {
            const el = document.getElementById('jp-date');
            if (!el) return;
            const n = new Date();
            const y = n.getFullYear(), mo = n.getMonth() + 1, d = n.getDate(), w = n.getDay();
            const h24 = n.getHours(), mi = n.getMinutes(), se = n.getSeconds();
            const reiwa = y - 2018;
            const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
            const pad = (x) => String(x).padStart(2, '0');

            el.innerHTML =
                rt(y + '年', yearRead(y) + 'ねん') + ' ' +
                rt(mo + '月', monthRead(mo)) + ' ' +
                rt(d + '日', dayRead(d)) + '<br>' +
                '<span class="text-lg md:text-xl">(' + rt('令和' + reiwa + '年', 'れいわ' + reiwaRead(reiwa) + 'ねん') + ') ' +
                rt(WEEK[w] + '曜日', WEEK_R[w] + 'ようび') + '</span>';

            document.getElementById('jp-time').innerHTML =
                rt(h24 < 12 ? '午前' : '午後', h24 < 12 ? 'ごぜん' : 'ごご') +
                rt(h12 + '時', hourRead(h12)) +
                rt(mi + '分', minuteRead(mi)) +
                se + '秒';
            document.getElementById('jp-clock').textContent = pad(h24) + ':' + pad(mi) + ':' + pad(se);
        }
        updateJapaneseClock();
        setInterval(updateJapaneseClock, 1000);

        // View Switcher
        function switchView(viewName) {
            const navButtons = document.querySelectorAll('.nav-btn');
            navButtons.forEach(btn => {
                if (btn.id === `nav-${viewName}`) {
                    btn.classList.add('bg-black', 'text-white');
                    btn.classList.remove('bg-white', 'text-black');
                } else {
                    btn.classList.remove('bg-black', 'text-white');
                    btn.classList.add('bg-white', 'text-black');
                }
            });

            document.querySelectorAll('.page-view').forEach(view => {
                view.classList.remove('block', 'flex');
                view.classList.add('hidden');
            });

            if (viewName === 'Kotoba') {
                headerTitle.textContent = "N5 KOTOBA";
                document.getElementById('view-kotoba').classList.remove('hidden');
                document.getElementById('view-kotoba').classList.add('block');
                updateItemCount(vocabData.find(c => c.id === currentKotobaCategoryId).items.length);
            } else if (viewName === 'Bunpou') {
                headerTitle.textContent = "N5 BUNPOU";
                document.getElementById('view-bunpou').classList.remove('hidden');
                document.getElementById('view-bunpou').classList.add('block');
                updateItemCount(bunpouData.find(c => c.id === currentBunpouCategoryId).items.length);
            } else if (viewName === 'Settings') {
                headerTitle.textContent = "SETTINGS";
                document.getElementById('view-settings').classList.remove('hidden');
                document.getElementById('view-settings').classList.add('flex');
                updateItemCount(0);
            } else if (viewName === 'Home') {
                headerTitle.textContent = "HOME";
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-home').classList.add('block');
                renderHome();
                updateItemCount(0);
            } else {
                headerTitle.textContent = "HOME";
                document.getElementById('view-soon').classList.remove('hidden');
                document.getElementById('view-soon').classList.add('flex');
                document.getElementById('soon-title').textContent = viewName;
                updateItemCount(0);
            }
        }

        function updateItemCount(count) {
            itemCount.textContent = count;
        }

        // --- KOTOBA LOGIC ---
        function renderKotobaCategories() {
            categoryNav.innerHTML = '';
            vocabData.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat.id === currentKotobaCategoryId;
                btn.className = `flex-shrink-0 px-3 py-1 border-2 border-black font-bold text-xs transition-colors ${
                    isActive ? 'bg-black text-white' : 'bg-white text-black hover:bg-gray-200'
                }`;
                btn.textContent = cat.title;
                btn.onclick = () => {
                    selectKotobaCategory(cat.id);
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };
                categoryNav.appendChild(btn);
            });
        }

        function renderVocab(categoryId) {
            const category = vocabData.find(c => c.id === categoryId);
            if (!category) return;

            currentCategoryTitle.textContent = category.title.replace(/[0-9]/g, '').trim(); 
            updateItemCount(category.items.length);
            
            vocabGrid.innerHTML = '';
            category.items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'border-2 border-black p-2 bg-white flex flex-col h-full hover:shadow-solid-sm transition-all relative group';
                
                let noteHtml = '';
                if (item.note) {
                    noteHtml = `
                        <div class="mt-2 pt-1 border-t-2 border-dashed border-gray-300">
                            <label class="cursor-pointer text-[9px] font-bold text-gray-500 uppercase tracking-wider block hover:text-black transition-colors text-center w-full">
                                <input type="checkbox" class="peer hidden note-toggle">
                                <span>[+] Info</span>
                                <div class="hidden peer-checked:block note-content mt-1 p-1 bg-gray-100 border border-black text-[10px] font-medium text-black normal-case leading-tight text-left">
                                    ${item.note}
                                </div>
                            </label>
                        </div>
                    `;
                }
                
                card.innerHTML = `
                    <div class="text-2xl md:text-3xl font-jp font-normal text-center mb-1 text-black tracking-widest break-words leading-tight">
                        ${item.j}
                    </div>
                    <div class="romaji-text text-[10px] md:text-xs text-center text-gray-600 font-mono tracking-tighter mb-1.5 leading-none">
                        ${item.r}
                    </div>
                    <div class="arti-text border-t-2 border-black pt-1 text-xs md:text-sm font-bold text-center mt-auto leading-tight">
                        ${item.m}
                    </div>
                    ${noteHtml}
                `;
                const key = itemKey(category.id, idx);
                const isDone = doneSet.has(key);
                card.classList.add('pt-6');
                if (isDone) card.classList.add('bg-gray-100');
                card.insertAdjacentHTML('afterbegin', `<label class="absolute top-1 left-1 z-10 cursor-pointer p-0.5" title="Sudah dikuasai"><input type="checkbox" class="w-4 h-4 accent-black cursor-pointer block" ${isDone ? 'checked' : ''}></label>`);
                const cb = card.querySelector('input[type=checkbox]');
                const lab = cb.parentElement;
                lab.addEventListener('click', ev => ev.stopPropagation());
                cb.addEventListener('change', () => toggleItemDone(category.id, idx, card, cb.checked));
                if (hasKanji(item.j)) {
                    card.classList.add('kanji-card');
                    card.insertAdjacentHTML('afterbegin', '<span class="kanji-dot"></span>');
                    card.addEventListener('click', (ev) => {
                        if (ev.target.closest('label, input')) return;
                        openKanjiModal(item);
                    });
                }
                vocabGrid.appendChild(card);
            });
            updateCategoryProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectKotobaCategory(id) {
            currentKotobaCategoryId = id;
            try { localStorage.setItem('n5_kotobaCategory', id); } catch (e) {}
            renderKotobaCategories();
            renderVocab(id);
        }

        // --- BUNPOU LOGIC ---
        function renderBunpouCategories() {
            bunpouCategoryNav.innerHTML = '';
            bunpouData.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat.id === currentBunpouCategoryId;
                btn.className = `flex-shrink-0 px-3 py-1 border-2 border-black font-bold text-xs transition-colors ${
                    isActive ? 'bg-black text-white' : 'bg-white text-black hover:bg-gray-200'
                }`;
                btn.textContent = cat.title;
                btn.onclick = () => {
                    selectBunpouCategory(cat.id);
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                };
                bunpouCategoryNav.appendChild(btn);
            });
        }

        function renderBunpou(categoryId) {
            const category = bunpouData.find(c => c.id === categoryId);
            if (!category) return;

            currentBunpouCategoryTitle.textContent = category.title.replace(/[0-9]/g, '').trim(); 
            updateItemCount(category.items.length);
            
            bunpouGrid.innerHTML = '';
            category.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'border-2 border-black p-3 bg-white hover:shadow-solid-sm transition-all flex flex-col gap-2';
                
                card.innerHTML = `
                    <div class="flex items-start gap-2">
                        <span class="font-black text-xs mt-1 min-w-[20px] text-gray-400">${index + 1}.</span>
                        <div class="w-full">
                            <div class="text-lg md:text-xl font-jp font-medium text-black leading-loose mb-1.5 break-words">
                                ${formatJapaneseText(item.j)}
                            </div>
                            <div class="romaji-text text-xs md:text-sm text-gray-600 font-mono leading-tight mb-2">
                                ${item.r}
                            </div>
                            <div class="arti-text border-t-2 border-black pt-2 text-sm md:text-base font-bold leading-tight">
                                ${item.m}
                            </div>
                        </div>
                    </div>
                `;
                bunpouGrid.appendChild(card);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectBunpouCategory(id) {
            currentBunpouCategoryId = id;
            try { localStorage.setItem('n5_bunpouCategory', id); } catch (e) {}
            renderBunpouCategories();
            renderBunpou(id);
        }

        // ==========================================
        // SETTINGS & LOCAL STORAGE
        // ==========================================
        const toggleRomaji = document.getElementById('toggle-romaji');
        const toggleArti = document.getElementById('toggle-arti');

        function loadSettings() {
            const saveRomaji = localStorage.getItem('n5_showRomaji');
            const saveArti = localStorage.getItem('n5_showArti');

            // Default is true if not set
            const isRomajiVisible = saveRomaji === null ? true : saveRomaji === 'true';
            const isArtiVisible = saveArti === null ? true : saveArti === 'true';

            toggleRomaji.checked = isRomajiVisible;
            if(!isRomajiVisible) document.body.classList.add('hide-romaji');

            toggleArti.checked = isArtiVisible;
            if(!isArtiVisible) document.body.classList.add('hide-arti');
        }

        toggleRomaji.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            if (isChecked) {
                document.body.classList.remove('hide-romaji');
            } else {
                document.body.classList.add('hide-romaji');
            }
            localStorage.setItem('n5_showRomaji', isChecked);
        });

        const toggleSerif = document.getElementById('toggle-serif');
        function applySerif(on) {
            document.body.classList.toggle('serif-jp', on);
            toggleSerif.checked = on;
        }
        applySerif(localStorage.getItem('n5_useSerif') === 'true');
        toggleSerif.addEventListener('change', (e) => {
            applySerif(e.target.checked);
            localStorage.setItem('n5_useSerif', e.target.checked);
        });

        toggleArti.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            if (isChecked) {
                document.body.classList.remove('hide-arti');
            } else {
                document.body.classList.add('hide-arti');
            }
            localStorage.setItem('n5_showArti', isChecked);
        });

        // ==========================================
        // INITIALIZATION
        // ==========================================
        loadSettings();
        
        renderKotobaCategories();
        renderVocab(currentKotobaCategoryId);
        
        renderBunpouCategories();
        renderBunpou(currentBunpouCategoryId);
        
        // Scroll tombol kategori aktif ke tampilan setelah refresh
        setTimeout(() => {
            document.querySelectorAll('#category-nav button, #bunpou-category-nav button').forEach(b => {
                if (b.className.includes('bg-black')) b.scrollIntoView({ inline: 'center', block: 'nearest' });
            });
        }, 50);

        // Start di Kotoba by default
        switchView('Kotoba');

    </script>
</body>
</html>
