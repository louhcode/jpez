            <div class="grid grid-cols-2 gap-2">
              <label class="flex cursor-pointer items-center justify-center rounded-2xl border border-white bg-white/85 py-2.5 px-3 text-center text-xs font-bold text-matcha-dark shadow-sm active:scale-95 transition">
                Muat Kanji .txt
                <input type="file" accept=".txt" class="hidden" onchange="handleTxtUpload(event, 'kanji')">
              </label>
              <label class="flex cursor-pointer items-center justify-center rounded-2xl border border-white bg-white/85 py-2.5 px-3 text-center text-xs font-bold text-matcha-dark shadow-sm active:scale-95 transition">
                Muat Kotoba .txt
                <input type="file" accept=".txt" class="hidden" onchange="handleTxtUpload(event, 'kotoba')">
              </label>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="exportProgressJson()" class="rounded-2xl bg-matcha-mintSoft py-2.5 px-3 text-xs font-bold text-[#25542B] active:scale-95 transition">Ekspor Progress</button>
              <label class="flex cursor-pointer items-center justify-center rounded-2xl bg-matcha-mintSoft py-2.5 px-3 text-xs font-bold text-[#25542B] active:scale-95 transition">
                Impor Progress
                <input type="file" accept=".json" class="hidden" onchange="importProgressJson(event)">
              </label>
            </div>
          </section>

          <!-- Reset Progress dengan Konfirmasi -->
          <section class="rounded-[26px] border border-[#F2D2D2] bg-[#FFF5F5]/80 p-4 shadow-glass backdrop-blur-xl">
            <div class="flex items-center justify-between gap-3">
              <div>
                <h3 class="text-sm font-extrabold text-[#9D3737]">Reset Semua Progress</h3>
                <p class="text-[11px] text-[#9E5D5D]">Hapus seluruh status hafalan, streak, dan riwayat</p>
              </div>
              <button onclick="confirmResetProgress()" class="shrink-0 rounded-2xl bg-[#C94C4C] px-4 py-2.5 text-xs font-bold text-white shadow-sm active:scale-95 transition">
                Reset
              </button>
            </div>
          </section>
        </div>
      `;
    }

    function renderSettingToggle(key, title, desc) {
      const active = !!appState.userData.settings[key];
      return `
        <button onclick="toggleSetting('${key}')" class="flex w-full items-center justify-between gap-3 rounded-2xl border border-white bg-white/75 px-3.5 py-2.5 text-left transition active:scale-[0.99]">
          <div class="min-w-0">
            <p class="text-xs font-bold text-matcha-dark">${title}</p>
            <p class="text-[10px] text-matcha-muted">${desc}</p>
          </div>
          <div class="relative h-6 w-11 shrink-0 rounded-full transition-colors duration-200 ${active ? 'bg-matcha-primary' : 'bg-[#CFD8CC]'}">
            <span class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform duration-200 ${active ? 'left-[22px]' : 'left-0.5'}"></span>
          </div>
        </button>
      `;
    }

    function toggleSetting(key) {
      appState.userData.settings[key] = !appState.userData.settings[key];
      saveUserData();
      renderProfileTab(document.getElementById('main-content'));
    }

    function adjustDailyGoal(delta) {
      const current = appState.userData.profile.dailyGoal || 20;
      const next = Math.min(100, Math.max(5, current + delta));
      appState.userData.profile.dailyGoal = next;
      saveUserData();
      renderProfileTab(document.getElementById('main-content'));
    }

    function openEditProfileModal() {
      const { name, bio } = appState.userData.profile;
      openConfirmModal({
        title: 'Edit Profil Pengguna',
        message: 'Perbarui nama panggilan dan catatan target belajarmu.',
        extraHtml: `
          <div class="space-y-2.5">
            <div>
              <label class="text-[11px] font-bold text-matcha-muted">Nama Pengguna</label>
              <input id="edit-prof-name" type="text" value="${escapeHtml(name)}" class="mt-1 w-full rounded-xl border border-matcha-sage/30 bg-white px-3 py-2 text-xs font-semibold text-matcha-dark focus:border-matcha-primary focus:outline-none">
            </div>
            <div>
              <label class="text-[11px] font-bold text-matcha-muted">Bio / Target Belajar</label>
              <input id="edit-prof-bio" type="text" value="${escapeHtml(bio)}" class="mt-1 w-full rounded-xl border border-matcha-sage/30 bg-white px-3 py-2 text-xs font-semibold text-matcha-dark focus:border-matcha-primary focus:outline-none">
            </div>
          </div>
        `,
        okLabel: 'Simpan',
        onConfirm: () => {
          const nextName = document.getElementById('edit-prof-name').value.trim();
          const nextBio = document.getElementById('edit-prof-bio').value.trim();
          if (!nextName) {
            showToast('Nama tidak boleh kosong');
            return false;
          }
          appState.userData.profile.name = nextName;
          appState.userData.profile.bio = nextBio || 'Target N5 • Konsisten setiap hari';
          saveUserData();
          renderProfileTab(document.getElementById('main-content'));
          showToast('Profil diperbarui');
        }
      });
    }

    function handleTxtUpload(event, kind) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = parseJpezTxt(reader.result, kind);
          if (parsed.length === 0) {
            showToast('File TXT kosong atau format kolom tidak sesuai.');
            return;
          }
          if (kind === 'kanji') {
            appState.kanjiList = parsed;
            appState.kanjiUI.bab = 'all';
            appState.kanjiUI.deckIndex = 0;
          } else {
            appState.kotobaList = parsed;
            appState.kotobaUI.bab = 'all';
            appState.kotobaUI.deckIndex = 0;
          }
          renderProfileTab(document.getElementById('main-content'));
          showToast(`Berhasil memuat ${parsed.length} ${kind === 'kanji' ? 'Kanji' : 'Kotoba'} dari ${file.name}`);
        } catch (err) {
          showToast('Gagal memproses file TXT.');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function exportProgressJson() {
      const blob = new Blob([JSON.stringify(appState.userData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `jpez-progress-${getLocalDateKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('File progress JSON berhasil diunduh');
    }

    function importProgressJson(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || typeof data !== 'object' || !data.progress) {
            showToast('Format file progress JSON tidak valid.');
            return;
          }
          const def = DEFAULT_USER_STATE();
          appState.userData = {
            ...def,
            ...data,
            profile: { ...def.profile, ...(data.profile || {}) },
            settings: { ...def.settings, ...(data.settings || {}) },
          };
          saveUserData();
          renderProfileTab(document.getElementById('main-content'));
          showToast('Progress berhasil dipulihkan!');
        } catch {
          showToast('Gagal membaca file JSON.');
        }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function confirmResetProgress() {
      openConfirmModal({
        title: 'Reset Semua Progress?',
        message: 'Seluruh status hafalan Kanji dan Kotoba, streak harian, serta riwayat latihan akan dikembalikan ke nol. Pengaturan profil tetap dipertahankan.',
        okLabel: 'Ya, Reset',
        okDanger: true,
        onConfirm: () => {
          const keptProfile = { ...appState.userData.profile };
          const keptSettings = { ...appState.userData.settings };
          appState.userData = DEFAULT_USER_STATE();
          appState.userData.profile = keptProfile;
          appState.userData.settings = keptSettings;
          saveUserData();
          renderProfileTab(document.getElementById('main-content'));
          showToast('Semua progress telah direset');
        }
      });
    }

    // =========================================================================
    // 13. GESTUR SWIPE SENTUH UNTUK FLASHCARD MOBILE
    // =========================================================================

    function attachSwipeHandlers(elementId, onSwipeLeft, onSwipeRight) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let startX = 0;
      let startY = 0;
      el.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener('touchend', (e) => {
        if (!e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) onSwipeLeft();
          else onSwipeRight();
        }
      }, { passive: true });
    }

    // =========================================================================
    // 14. INISIALISASI LANGSUNG DARI SUMBER FILE .TXT
    // =========================================================================

    function initApp() {
      const rawKanji = document.getElementById('raw-kanji-txt').textContent;
      const rawKotoba = document.getElementById('raw-kotoba-txt').textContent;

      appState.kanjiList = parseJpezTxt(rawKanji, 'kanji');
      appState.kotobaList = parseJpezTxt(rawKotoba, 'kotoba');

      updateNavBar();
      renderCurrentTab();
    }

    // Fungsi hook untuk sinkronisasi penyimpanan cloud eksternal
    window.jpezApplyRemoteState = function(remoteData) {
      if (!remoteData || typeof remoteData !== 'object') return;
      const def = DEFAULT_USER_STATE();
      appState.userData = {
        ...def,
        ...remoteData,
        profile: { ...def.profile, ...(remoteData.profile || {}) },
        settings: { ...def.settings, ...(remoteData.settings || {}) },
      };
      // Render ulang hanya jika tidak sedang berada di tengah sesi latihan aktif
      if (!appState.session) {
        renderCurrentTab();
      }
    };

    window.jpezSetSyncStatus = function(connected, label) {
      appState.cloudConnected = connected;
      appState.syncStatusText = label;
      if (appState.activeTab === 'profile' && !appState.session) {
        renderProfileTab(document.getElementById('main-content'));
      }
    };

    // Jalankan aplikasi segera setelah DOM siap
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>

  <!-- =====================================================================
       MODUL SINKRONISASI PENYIMPANAN CLOUD OTOMATIS (TANPA LOCALSTORAGE)
       ===================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let db = null;
    let currentUser = null;
    let userStateDocRef = null;
    let saveDebounceTimer = null;
    let isApplyingRemote = false;

    async function initCloudSync() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          window.jpezSetSyncStatus(false, 'Mode Statis (Gunakan Ekspor JSON)');
          return;
        }

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        db = getFirestore(app);

        // Wajib autentikasi terlebih dahulu sebelum mengakses database
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) return;

        const userId = currentUser.uid;
        // Strict Path Rule: /artifacts/{appId}/users/{userId}/{collectionName}
        userStateDocRef = doc(db, 'artifacts', appId, 'users', userId, 'jpez_data', 'user_state');

        window.jpezSetSyncStatus(true, 'Sinkronisasi Cloud Aktif');

        onSnapshot(
          userStateDocRef,
          (snapshot) => {
            if (snapshot.exists()) {
              isApplyingRemote = true;
              try {
                window.jpezApplyRemoteState(snapshot.data());
              } finally {
                isApplyingRemote = false;
              }
            }
          },
          (error) => {
            console.error('Gagal membaca sinkronisasi cloud:', error);
            window.jpezSetSyncStatus(false, 'Sinkronisasi Terjeda');
          }
        );

        window.jpezCloudSave = function(userData) {
          if (!currentUser || !userStateDocRef || isApplyingRemote) return;
          clearTimeout(saveDebounceTimer);
          saveDebounceTimer = setTimeout(async () => {
            if (!currentUser || !userStateDocRef) return;
            try {
              // Pastikan payload bersih untuk JSON/Firestore
              const cleanPayload = JSON.parse(JSON.stringify(userData));
              await setDoc(userStateDocRef, cleanPayload, { merge: true });
            } catch (err) {
              console.error('Gagal menyimpan progress:', err);
            }
          }, 250);
        };
      } catch (err) {
        console.error('Inisialisasi cloud tidak tersedia:', err);
        window.jpezSetSyncStatus(false, 'Mode Sesi Lokal');
      }
    }

    initCloudSync();
  </script>
