<!-- MAIN SETTINGS VIEW -->
<div id="view-settings" class="page-view hidden pt-[50px] min-h-screen flex items-center justify-center px-4">
    <div class="border-2 border-black p-6 md:p-8 bg-white shadow-solid w-full max-w-sm">
        <h2 class="text-2xl md:text-3xl font-black mb-4 uppercase text-center">Settings</h2>
        <div class="border-t-4 border-black w-12 mx-auto mb-6"></div>

        <div class="flex flex-col gap-4">
            <label class="flex items-center justify-between cursor-pointer group">
                <span class="font-bold text-sm md:text-base group-hover:underline">Tampilkan Romaji</span>
                <input type="checkbox" id="toggle-romaji" class="w-6 h-6 accent-black border-2 border-black cursor-pointer transition-transform hover:scale-110">
            </label>

            <div class="border-b-2 border-black border-dashed"></div>

            <label class="flex items-center justify-between cursor-pointer group">
                <span class="font-bold text-sm md:text-base group-hover:underline">Tampilkan Arti (B. Indo)</span>
                <input type="checkbox" id="toggle-arti" class="w-6 h-6 accent-black border-2 border-black cursor-pointer transition-transform hover:scale-110">
            </label>
        </div>

        <p class="text-[11px] font-bold text-gray-500 mt-8 text-center leading-tight">Hilangkan centang untuk menyembunyikan teks. Pengaturan ini akan tersimpan di perangkat Anda!</p>
    </div>
</div>
