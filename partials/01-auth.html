    <!-- AUTH: REGISTER / LOGIN -->
    <div id="auth-screen" class="fixed inset-0 z-[310] bg-white flex items-start justify-center px-4 overflow-y-auto">
        <form id="auth-form" class="border-2 border-black bg-white shadow-solid p-6 w-full max-w-sm my-8" autocomplete="on" novalidate>
            <div class="text-center">
                <div class="font-jp text-4xl font-black">日本語</div>
                <h1 class="text-2xl font-black uppercase tracking-widest">JPEZ</h1>
                <div class="text-[11px] font-bold text-gray-500">Belajar Bahasa Jepang N5</div>
                <div class="border-t-4 border-black w-12 mx-auto my-3"></div>
            </div>
            <div class="flex border-2 border-black mb-4">
                <button type="button" id="auth-tab-login" class="flex-1 py-2 font-bold text-sm uppercase bg-black text-white">Masuk</button>
                <button type="button" id="auth-tab-register" class="flex-1 py-2 font-bold text-sm uppercase bg-white text-black hover:bg-gray-200 border-l-2 border-black">Daftar</button>
            </div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Username</label>
            <input id="auth-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" class="w-full border-2 border-black px-3 py-2 font-bold text-sm outline-none mb-3">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Password</label>
            <div class="flex border-2 border-black mb-3">
                <input id="auth-pass" type="password" autocomplete="current-password" maxlength="64" class="flex-1 min-w-0 px-3 py-2 font-bold text-sm outline-none bg-white">
                <button type="button" id="auth-eye" class="px-3 border-l-2 border-black text-xs font-black uppercase hover:bg-black hover:text-white">Lihat</button>
            </div>
            <div id="auth-confirm-wrap" class="hidden">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Ulangi Password</label>
                <input id="auth-pass2" type="password" autocomplete="new-password" maxlength="64" class="w-full border-2 border-black px-3 py-2 font-bold text-sm outline-none mb-3">
            </div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1">Nama Perangkat</label>
            <input id="auth-device-name" type="text" maxlength="60" class="w-full border-2 border-black px-3 py-2 font-bold text-sm outline-none mb-1">
            <p class="text-[11px] font-bold text-gray-500 mb-1">Dipakai untuk membatasi jumlah perangkat per akun.</p>
            <p id="auth-error" class="text-xs font-bold text-red-600 mt-2 min-h-[1rem]"></p>
            <button type="submit" id="auth-submit" class="w-full mt-2 border-2 border-black bg-black text-white py-2 font-bold text-sm uppercase hover:bg-white hover:text-black transition-colors">Masuk</button>
            <p id="auth-hint" class="text-[11px] font-bold text-gray-500 text-center mt-3"></p>
        </form>
    </div>
